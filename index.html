<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAGGY FOREVER — Premium Streetwear</title>
  <meta name="description" content="Discover curated premium streetwear, vintage finds, and everyday essentials at BAGGY FOREVER. Bhopal, India." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <style>
    /* ===== DESIGN SYSTEM ===== */
    :root {
      /* Core Palette — Editorial Streetwear */
      --bg: #f4f2ed;
      --bg-alt: #e8e4db;
      --surface: #ffffff;
      --ink: #111111;
      --ink-light: #3d3d3d;
      --muted: #7a7a7a;
      --line: #d4cfc4;
      --accent: #ff3b1f;      /* Signature Red */
      --accent-dark: #cc2e18;
      --success: #2e7d32;
      --danger: #d32f2f;
      
      /* Typography */
      --font-display: 'Anton', sans-serif;
      --font-sans: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      
      /* Spacing & Radii */
      --r-sm: 2px;
      --r-md: 4px;
      --r-lg: 8px;
      --space-xs: 8px;
      --space-sm: 16px;
      --space-md: 24px;
      --space-lg: 48px;
      --space-xl: 96px;
      
      /* Shadows */
      --sh-sm: 0 2px 8px rgba(0,0,0,0.04);
      --sh-md: 0 8px 24px rgba(0,0,0,0.08);
      --sh-lg: 0 16px 48px rgba(0,0,0,0.12);
      
      /* Motion */
      --ease: cubic-bezier(0.25, 1, 0.5, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-fast: 200ms;
      --dur-med: 400ms;
      --dur-slow: 700ms;
      
      --nav-height: 72px;
    }

    /* ===== RESET ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Typography */
    h1, h2, h3, h4 { font-weight: 400; line-height: 1.05; color: var(--ink); font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; }
    h1 { font-size: clamp(3rem, 8vw, 7rem); }
    h2 { font-size: clamp(2.2rem, 5vw, 4rem); }
    h3 { font-size: clamp(1.5rem, 3vw, 2.2rem); }
    
    .serif { font-family: var(--font-sans); text-transform: none; letter-spacing: -0.02em; font-weight: 500; }
    
    a { color: inherit; text-decoration: none; transition: color var(--dur-fast) var(--ease); }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    img { display: block; max-width: 100%; }
    input, textarea, select { font-family: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    /* Utilities */
    .container { max-width: 1440px; margin: 0 auto; padding: 0 var(--space-md); }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .hidden { display: none !important; }
    .text-center { text-align: center; }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 16px 32px; font-family: var(--font-sans); font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      border-radius: var(--r-sm); transition: all var(--dur-fast) var(--ease); cursor: pointer;
      position: relative; overflow: hidden;
    }
    .btn-primary { background: var(--ink); color: #fff; border: 1px solid var(--ink); }
    .btn-primary::after {
      content: ''; position: absolute; inset: 0; background: var(--accent);
      transform: translateY(100%); transition: transform var(--dur-fast) var(--ease);
      z-index: 1;
    }
    .btn-primary:hover::after { transform: translateY(0); }
    .btn-primary span { position: relative; z-index: 2; }
    .btn-primary:hover span { color: #fff; }
    
    .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
    .btn-outline:hover { background: var(--ink); color: #fff; }
    
    .btn-accent { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
    .btn-accent:hover { background: var(--accent-dark); border-color: var(--accent-dark); transform: translateY(-2px); box-shadow: var(--sh-md); }
    
    .btn-sm { padding: 12px 24px; font-size: 0.7rem; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ===== NAVIGATION ===== */
    .navbar {
      position: sticky; top: 0; height: var(--nav-height);
      background: rgba(244, 242, 237, 0.92); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line); z-index: 90;
      transition: transform var(--dur-med) var(--ease), box-shadow var(--dur-med) var(--ease), background var(--dur-med) var(--ease);
    }
    .navbar.scrolled { background: rgba(244, 242, 237, 0.98); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .navbar-inner {
      max-width: 1440px; margin: 0 auto; padding: 0 var(--space-md);
      height: 100%; display: flex; align-items: center; justify-content: space-between;
    }
    .brand-logo {
      font-family: var(--font-display); font-size: 1.8rem; letter-spacing: 0.02em;
      text-transform: uppercase; cursor: pointer; display: flex; align-items: baseline; gap: 2px;
      transition: transform var(--dur-fast) var(--ease);
    }
    .brand-logo:hover { transform: scale(1.02); }
    .brand-logo span { color: var(--accent); }
    
    .nav-links { display: flex; gap: var(--space-lg); align-items: center; }
    .nav-links a {
      font-family: var(--font-sans); font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; position: relative; padding: 8px 0;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 0;
      height: 2px; background: var(--accent); transition: width var(--dur-fast) var(--ease);
    }
    .nav-links a:hover::after { width: 100%; }

    .nav-actions { display: flex; gap: 4px; align-items: center; }
    .icon-btn {
      width: 44px; height: 44px; display: grid; place-items: center;
      border-radius: 50%; transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease-spring); position: relative;
    }
    .icon-btn:hover { background: var(--bg-alt); transform: scale(1.08); }
    .icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; }
    
    .cart-count {
      position: absolute; top: 4px; right: 4px; background: var(--accent); color: #fff;
      font-family: var(--font-sans); font-size: 0.6rem; font-weight: 700; width: 18px; height: 18px;
      border-radius: 50%; display: grid; place-items: center;
      transition: transform var(--dur-fast) var(--ease-spring);
    }
    .cart-count.bump { animation: badgeBump var(--dur-fast) var(--ease-spring); }
    @keyframes badgeBump { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }
    .mobile-menu-btn { display: none; }

    /* ===== HERO ===== */
    .hero {
      position: relative; height: calc(100vh - var(--nav-height)); min-height: 650px;
      max-height: 950px; background: var(--ink); overflow: hidden;
      display: flex; align-items: center;
    }
    .hero-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; opacity: 0.85; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(17,17,17,0.85) 0%, rgba(17,17,17,0.4) 60%, transparent 100%); }
    .hero-content {
      position: relative; z-index: 2; max-width: 700px;
      padding: var(--space-xl) var(--space-lg); color: #fff;
    }
    .hero-subtitle { 
      font-family: var(--font-sans); font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase; 
      color: var(--accent); margin-bottom: var(--space-sm); display: block; 
      opacity: 0; animation: slideUp 0.8s var(--ease-out) 0.2s forwards; 
    }
    .hero-title { margin-bottom: var(--space-md); color: #fff; opacity: 0; animation: slideUp 0.8s var(--ease-out) 0.4s forwards; }
    .hero-title span { color: var(--accent); }
    .hero-desc { 
      font-family: var(--font-body); font-size: 1.1rem; color: rgba(255,255,255,0.8); 
      margin-bottom: var(--space-lg); max-width: 500px; line-height: 1.7; 
      opacity: 0; animation: slideUp 0.8s var(--ease-out) 0.6s forwards; 
    }
    .hero-actions { display: flex; gap: var(--space-sm); flex-wrap: wrap; opacity: 0; animation: slideUp 0.8s var(--ease-out) 0.8s forwards; }
    
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== SECTION STYLES ===== */
    .section { padding: var(--space-xl) 0; }
    .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--space-lg); flex-wrap: wrap; gap: var(--space-md); }
    .section-header h2 { margin-bottom: 8px; }
    .section-header p { color: var(--muted); font-family: var(--font-body); font-size: 0.95rem; max-width: 500px; }

    /* ===== PRODUCT GRID ===== */
    .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-md); }
    @media (max-width: 1024px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .product-grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-sm); } }

    .product-card {
      background: var(--surface); border-radius: var(--r-md); overflow: hidden;
      transition: transform var(--dur-med) var(--ease), box-shadow var(--dur-med) var(--ease);
      cursor: pointer; display: flex; flex-direction: column; position: relative;
      border: 1px solid transparent;
    }
    .product-card:hover { transform: translateY(-8px); box-shadow: var(--sh-md); border-color: var(--line); }
    .product-image-wrapper { position: relative; aspect-ratio: 4/5; background: var(--bg-alt); overflow: hidden; }
    .product-image-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--dur-slow) var(--ease); }
    .product-card:hover .product-image-wrapper img { transform: scale(1.06); }
    
    .product-badge {
      position: absolute; top: 16px; left: 16px; background: var(--accent); color: #fff;
      font-family: var(--font-sans); font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; 
      text-transform: uppercase; padding: 5px 12px; border-radius: var(--r-sm); z-index: 2;
    }
    
    .wishlist-btn {
      position: absolute; top: 12px; right: 12px; width: 40px; height: 40px;
      border-radius: 50%; background: rgba(255,255,255,0.95); backdrop-filter: blur(4px);
      display: grid; place-items: center; transition: all var(--dur-fast) var(--ease); z-index: 2;
      opacity: 0; transform: translateY(-8px);
    }
    .product-card:hover .wishlist-btn { opacity: 1; transform: translateY(0); }
    .wishlist-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; transition: all var(--dur-fast) var(--ease); }
    .wishlist-btn.active svg { fill: var(--accent); stroke: var(--accent); }
    .wishlist-btn.pop { animation: heartPop var(--dur-fast) var(--ease-spring); }
    @keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

    .product-info { padding: var(--space-md); display: flex; flex-direction: column; flex: 1; }
    .product-name { 
      font-family: var(--font-sans); font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; 
      color: var(--ink); line-height: 1.3; text-transform: uppercase; letter-spacing: 0.02em;
    }
    .product-category { font-family: var(--font-body); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: var(--space-sm); }
    .product-price { font-family: var(--font-sans); font-weight: 700; font-size: 1.1rem; margin-top: auto; color: var(--ink); }
    .product-price s { color: var(--muted); font-weight: 400; font-size: 0.85rem; margin-left: 8px; }

    /* ===== SHOP PAGE ===== */
    .shop-layout { display: grid; grid-template-columns: 260px 1fr; gap: var(--space-xl); align-items: start; }
    @media (max-width: 900px) { .shop-layout { grid-template-columns: 1fr; gap: var(--space-md); } .filters-sidebar { display: none; } }
    
    .filters-sidebar { position: sticky; top: calc(var(--nav-height) + var(--space-md)); }
    .filter-group { margin-bottom: var(--space-md); padding-bottom: var(--space-md); border-bottom: 1px solid var(--line); }
    .filter-group h4 { font-family: var(--font-sans); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: var(--space-sm); }
    .filter-list { display: flex; flex-direction: column; gap: 10px; }
    .filter-list label { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--ink-light); cursor: pointer; transition: color var(--dur-fast) var(--ease); }
    .filter-list label:hover { color: var(--ink); }
    .filter-list input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
    
    .shop-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); flex-wrap: wrap; gap: var(--space-sm); }
    .sort-select { 
      padding: 10px 16px; border: 1px solid var(--line); border-radius: var(--r-sm); 
      background: var(--surface); font-size: 0.85rem; color: var(--ink); cursor: pointer; 
      font-family: var(--font-sans); font-weight: 500;
    }
    .sort-select:focus { outline: none; border-color: var(--ink); }

    /* ===== PRODUCT DETAIL ===== */
    .pdp-layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xl); padding-top: var(--space-lg); }
    @media (max-width: 900px) { .pdp-layout { grid-template-columns: 1fr; gap: var(--space-lg); } }
    
    .pdp-gallery { position: sticky; top: calc(var(--nav-height) + var(--space-md)); }
    .pdp-main-image { width: 100%; aspect-ratio: 4/5; background: var(--bg-alt); border-radius: var(--r-md); overflow: hidden; margin-bottom: var(--space-sm); position: relative; }
    .pdp-main-image img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--dur-slow) var(--ease); }
    .pdp-main-image:hover img { transform: scale(1.03); }
    
    .pdp-thumbnails { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .pdp-thumb { 
      aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; cursor: pointer; 
      border: 2px solid transparent; transition: border-color var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease); 
      opacity: 0.6;
    }
    .pdp-thumb:hover { opacity: 1; }
    .pdp-thumb.active { border-color: var(--ink); opacity: 1; }
    .pdp-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .pdp-info { padding-top: var(--space-sm); }
    .breadcrumb { font-family: var(--font-sans); font-size: 0.8rem; color: var(--muted); margin-bottom: var(--space-md); display: flex; gap: 8px; align-items: center; }
    .breadcrumb a { color: var(--muted); } .breadcrumb a:hover { color: var(--ink); } .breadcrumb span { color: var(--ink); }
    
    .pdp-title { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: var(--space-xs); }
    .pdp-price { font-family: var(--font-sans); font-size: 1.6rem; font-weight: 700; margin-bottom: var(--space-md); color: var(--accent); }
    .pdp-price s { color: var(--muted); font-size: 1rem; font-weight: 400; margin-left: 12px; }
    .pdp-desc { font-family: var(--font-body); color: var(--ink-light); line-height: 1.8; margin-bottom: var(--space-lg); font-size: 1rem; }
    
    .pdp-options { margin-bottom: var(--space-lg); }
    .pdp-options h4 { font-family: var(--font-sans); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
    .size-selector { display: flex; gap: 8px; flex-wrap: wrap; }
    .size-btn {
      min-width: 52px; height: 52px; border: 1px solid var(--line); border-radius: var(--r-sm);
      display: grid; place-items: center; font-family: var(--font-sans); font-weight: 600; font-size: 0.9rem;
      transition: all var(--dur-fast) var(--ease); background: var(--surface);
    }
    .size-btn:hover { border-color: var(--ink); }
    .size-btn.selected { background: var(--ink); color: #fff; border-color: var(--ink); transform: scale(1.05); }
    
    .pdp-actions { display: flex; gap: var(--space-sm); margin-bottom: var(--space-lg); }
    .pdp-actions .btn-primary { flex: 1; padding: 20px; font-size: 0.9rem; }
    .pdp-actions .btn-outline { flex: 0 0 auto; padding: 20px; }
    
    .pdp-ar-teaser { background: var(--bg-alt); border: 1px dashed var(--line); border-radius: var(--r-md); padding: var(--space-md); text-align: center; margin-bottom: var(--space-lg); }
    .pdp-ar-teaser h4 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 6px; color: var(--accent); }
    .pdp-ar-teaser p { font-family: var(--font-body); font-size: 0.9rem; color: var(--muted); margin-bottom: 14px; }
    
    .pdp-specs { border-top: 1px solid var(--line); padding-top: var(--space-md); margin-top: var(--space-md); }
    .spec-row { display: flex; padding: 14px 0; border-bottom: 1px solid var(--line); font-family: var(--font-body); font-size: 0.9rem; }
    .spec-row .label { width: 140px; color: var(--muted); flex-shrink: 0; }
    .spec-row .value { font-weight: 500; color: var(--ink); }

    /* ===== REVIEWS ===== */
    .reviews-section { margin-top: var(--space-xl); padding-top: var(--space-lg); border-top: 2px solid var(--ink); }
    .review-list { display: grid; gap: var(--space-md); margin-top: var(--space-md); }
    .review-card { 
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); 
      padding: var(--space-md); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); 
    }
    .review-card:hover { transform: translateY(-2px); box-shadow: var(--sh-sm); }
    .review-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .review-author { font-family: var(--font-sans); font-weight: 700; } 
    .review-date { color: var(--muted); font-size: 0.85rem; font-family: var(--font-body); }
    .review-stars { color: var(--accent); margin-bottom: 8px; letter-spacing: 2px; font-size: 1.1rem; }
    .review-text { color: var(--ink-light); font-size: 0.95rem; line-height: 1.7; font-family: var(--font-body); }

    /* ===== STORE INFO & FOOTER ===== */
    .footer { background: var(--ink); color: #fff; padding: var(--space-xl) 0 var(--space-md); margin-top: var(--space-xl); }
    .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: var(--space-lg); margin-bottom: var(--space-lg); }
    @media (max-width: 768px) { .footer-grid { grid-template-columns: 1fr; gap: var(--space-md); } }
    
    .footer-brand h3 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: var(--space-sm); color: #fff; }
    .footer-brand p { color: rgba(255,255,255,0.6); font-family: var(--font-body); font-size: 0.9rem; max-width: 300px; line-height: 1.7; }
    
    .footer-col h4 { font-family: var(--font-sans); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: var(--space-sm); color: var(--accent); }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .footer-col a { font-family: var(--font-body); font-size: 0.9rem; color: rgba(255,255,255,0.6); transition: color var(--dur-fast) var(--ease); } 
    .footer-col a:hover { color: #fff; }
    
    .footer-bottom { 
      border-top: 1px solid rgba(255,255,255,0.1); padding-top: var(--space-md); 
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-sm); 
      font-family: var(--font-body); font-size: 0.8rem; color: rgba(255,255,255,0.4); 
    }

    .store-info-section { background: var(--surface); padding: var(--space-xl) 0; border-top: 1px solid var(--line); }
    .store-detail { display: flex; gap: var(--space-sm); margin-bottom: var(--space-md); }
    .store-detail svg { width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 1.8; flex-shrink: 0; }
    .store-detail h4 { font-family: var(--font-sans); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .store-detail p { font-family: var(--font-body); color: var(--ink-light); font-size: 0.95rem; line-height: 1.6; }

    /* ===== CART DRAWER ===== */
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 200; opacity: 0; pointer-events: none; transition: opacity var(--dur-med) var(--ease); }
    .cart-overlay.active { opacity: 1; pointer-events: all; }
    
    .cart-drawer {
      position: fixed; top: 0; right: 0; width: 100%; max-width: 460px; height: 100vh;
      background: var(--surface); z-index: 210; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform var(--dur-med) var(--ease-out); box-shadow: var(--sh-lg);
    }
    .cart-drawer.active { transform: translateX(0); }
    
    .cart-header { padding: var(--space-md); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .cart-header h3 { font-family: var(--font-display); font-size: 1.5rem; }
    
    .cart-items { flex: 1; overflow-y: auto; padding: var(--space-md); }
    .cart-empty { text-align: center; padding: var(--space-xl) var(--space-md); color: var(--muted); }
    .cart-item { display: flex; gap: var(--space-sm); padding: var(--space-sm) 0; border-bottom: 1px solid var(--line); animation: slideIn var(--dur-med) var(--ease-out); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .cart-item-img { width: 80px; height: 100px; border-radius: var(--r-sm); overflow: hidden; background: var(--bg-alt); flex-shrink: 0; }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-info { flex: 1; }
    .cart-item-info h4 { font-family: var(--font-sans); font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; }
    .cart-item-info p { font-family: var(--font-body); font-size: 0.85rem; color: var(--muted); }
    .cart-item-price { font-family: var(--font-sans); font-weight: 700; margin-top: 8px; color: var(--accent); }
    
    .cart-item-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .qty-btn { 
      width: 28px; height: 28px; border: 1px solid var(--line); border-radius: var(--r-sm); 
      display: grid; place-items: center; font-size: 1rem; transition: all var(--dur-fast) var(--ease); 
    }
    .qty-btn:hover { border-color: var(--ink); background: var(--bg-alt); }
    .remove-btn { margin-left: auto; font-family: var(--font-sans); font-size: 0.75rem; color: var(--muted); text-decoration: underline; transition: color var(--dur-fast) var(--ease); }
    .remove-btn:hover { color: var(--danger); }

    .cart-footer { padding: var(--space-md); border-top: 1px solid var(--line); background: var(--bg); }
    .cart-total-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-family: var(--font-body); font-size: 0.9rem; color: var(--ink-light); }
    .cart-total-row.grand-total { 
      font-family: var(--font-sans); font-size: 1.2rem; font-weight: 700; color: var(--ink); 
      margin: var(--space-sm) 0; padding-top: var(--space-sm); border-top: 1px solid var(--line); 
    }

    /* ===== MODALS ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
      z-index: 300; display: grid; place-items: center; padding: var(--space-md);
      opacity: 0; pointer-events: none; transition: opacity var(--dur-med) var(--ease);
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    
    .modal-content {
      background: var(--surface); border-radius: var(--r-lg); width: 100%; max-width: 520px;
      padding: var(--space-lg); position: relative; transform: translateY(30px) scale(0.96);
      transition: transform var(--dur-med) var(--ease-out);
    }
    .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
    
    .modal-close { 
      position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; 
      display: grid; place-items: center; font-size: 1.5rem; color: var(--muted); border-radius: 50%; 
      transition: background var(--dur-fast) var(--ease); 
    }
    .modal-close:hover { background: var(--bg-alt); color: var(--ink); }
    
    .modal-content h3 { font-family: var(--font-display); font-size: 1.8rem; margin-bottom: 12px; }
    .modal-content p { font-family: var(--font-body); color: var(--ink-light); line-height: 1.7; margin-bottom: var(--space-md); }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 120px);
      background: var(--ink); color: #fff; padding: 14px 28px; border-radius: 50px;
      font-family: var(--font-sans); font-size: 0.85rem; font-weight: 500; z-index: 400; 
      opacity: 0; transition: all var(--dur-med) var(--ease-spring); pointer-events: none; 
      box-shadow: var(--sh-lg); display: flex; align-items: center; gap: 10px;
    }
    .toast.active { opacity: 1; transform: translate(-50%, 0); }

    /* ===== BACK TO TOP ===== */
    .back-to-top {
      position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px;
      background: var(--ink); color: #fff; border-radius: 50%;
      display: grid; place-items: center; z-index: 100;
      opacity: 0; pointer-events: none; transform: translateY(20px);
      transition: all var(--dur-fast) var(--ease-out); box-shadow: var(--sh-md);
    }
    .back-to-top.visible { opacity: 1; pointer-events: all; transform: translateY(0); }
    .back-to-top:hover { background: var(--accent); transform: translateY(-4px); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      :root { --space-xl: 56px; --space-lg: 36px; }
      .nav-links { display: none; }
      .mobile-menu-btn { display: grid; }
      .navbar-inner { padding: 0 var(--space-sm); }
      .hero-content { padding: var(--space-lg) var(--space-md); }
      .hero-title { font-size: 3rem; }
      .pdp-actions { flex-direction: column; }
      .pdp-actions .btn-outline { width: 100%; }
    }

    /* ===== REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <header class="navbar" id="navbar">
    <div class="navbar-inner">
      <div class="brand-logo" onclick="navigate('home')">
        BAGGY<span>FOREVER</span>
      </div>
      
      <nav class="nav-links">
        <a onclick="navigate('home')">Home</a>
        <a onclick="navigate('shop')">Shop All</a>
        <a onclick="navigate('shop', {cat: 'tshirts'})">T-Shirts</a>
        <a onclick="navigate('shop', {cat: 'hoodies'})">Hoodies</a>
        <a onclick="navigate('about')">About</a>
      </nav>

      <div class="nav-actions">
        <button class="icon-btn" onclick="handleAuthClick()" aria-label="Account" id="auth-btn">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
        
        <button class="icon-btn" onclick="openCart()" aria-label="Shopping Bag">
          <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 01-8 0"></path></svg>
          <span class="cart-count" id="cart-count">0</span>
        </button>
        
        <button class="icon-btn mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
          <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main id="app"></main>

  <!-- CART DRAWER -->
  <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>Shopping Bag</h3>
      <button class="modal-close" onclick="closeCart()" aria-label="Close Cart">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total-row"><span>Subtotal</span><span id="cart-subtotal">₹0</span></div>
      <div class="cart-total-row"><span>Shipping</span><span>Calculated at checkout</span></div>
      <div class="cart-total-row grand-total"><span>Total</span><span id="cart-total">₹0</span></div>
      <button class="btn btn-accent" style="width:100%" onclick="handleCheckout()">
        <span>CHECKOUT — COMING SOON</span>
      </button>
      <p style="text-align:center; font-size:0.75rem; color:var(--muted); margin-top:12px; font-family:var(--font-body);">Online purchasing will be available soon.</p>
    </div>
  </aside>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" id="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- BACK TO TOP -->
  <button class="back-to-top" id="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>
  </button>

  <script>
    /* =========================================================================
       PRODUCT DATA — EXTENDED CATALOGUE
       ========================================================================= */
    
    const PRODUCTS = [
      {
        id: 'ts-001', name: 'Oversized Heavyweight Tee', price: 799, mrp: 1200, category: 'tshirts', badge: 'New',
        sizes: ['S', 'M', 'L', 'XL'],
        images: [
          'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=800&auto=format&fit=crop',
          'https://images.unsplash.com/photo-1503341504253-dff4815485f1?q=80&w=800&auto=format&fit=crop'
        ],
        description: 'Premium heavyweight cotton tee with a relaxed, oversized fit. Features a ribbed crew neck and dropped shoulders.',
        specs: { Fabric: '100% Cotton (240 GSM)', Fit: 'Oversized', Care: 'Machine wash cold', Origin: 'Imported' },
        reviews: [{ author: 'Rahul S.', date: '2 weeks ago', stars: 5, text: 'Insane quality. The fit is perfect and the material feels premium.' }]
      },
      {
        id: 'ts-002', name: 'Classic White Crew Tee', price: 499, mrp: 799, category: 'tshirts', badge: '',
        sizes: ['S', 'M', 'L', 'XL'],
        images: ['https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=800&auto=format&fit=crop'],
        description: 'A timeless essential. This classic crew-neck tee is cut from soft, breathable cotton.',
        specs: { Fabric: '100% Cotton (180 GSM)', Fit: 'Regular', Care: 'Machine wash cold', Origin: 'Imported' },
        reviews: []
      },
      {
        id: 'hd-001', name: 'Black Harocott Hoodie', price: 1200, mrp: 1800, category: 'hoodies', badge: 'New',
        sizes: ['S', 'M', 'L', 'XL'],
        images: [
          'https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=800&auto=format&fit=crop',
          'https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?q=80&w=800&auto=format&fit=crop'
        ],
        description: 'Premium heavyweight cotton hoodie with custom sleeve print. Relaxed fit for everyday wear.',
        specs: { Fabric: '100% Cotton Fleece', Fit: 'Oversized', Care: 'Machine wash cold', Origin: 'Imported' },
        reviews: [{ author: 'Priya M.', date: '1 month ago', stars: 4, text: 'Really unique piece. Got so many compliments.' }]
      },
      {
        id: 'tr-001', name: 'Baggy Fit Denim', price: 1499, mrp: 2199, category: 'trousers', badge: 'New',
        sizes: ['30', '32', '34', '36'],
        images: [
          'https://images.unsplash.com/photo-1542272604-787c3835535d?q=80&w=800&auto=format&fit=crop',
          'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=800&auto=format&fit=crop'
        ],
        description: 'Ultra-relaxed baggy denim with a vintage wash. A staple for any streetwear wardrobe.',
        specs: { Fabric: '100% Cotton Denim', Fit: 'Baggy', Care: 'Machine wash cold', Origin: 'Imported' },
        reviews: []
      },
      {
        id: 'jk-001', name: 'Classic Denim Jacket', price: 1699, mrp: 2499, category: 'jackets', badge: 'New',
        sizes: ['S', 'M', 'L'],
        images: [
          'https://images.unsplash.com/photo-1576995853123-5a10305d93c0?q=80&w=800&auto=format&fit=crop',
          'https://images.unsplash.com/photo-1544022613-e87ca75a784a?q=80&w=800&auto=format&fit=crop'
        ],
        description: 'Timeless denim jacket with a modern oversized fit. A wardrobe essential.',
        specs: { Fabric: '100% Cotton Denim', Fit: 'Oversized', Care: 'Machine wash cold', Origin: 'Imported' },
        reviews: []
      },
      {
        id: 'sh-001', name: 'Oversized Oxford Shirt', price: 1299, mrp: 1899, category: 'shirts', badge: '',
        sizes: ['S', 'M', 'L', 'XL'],
        images: ['https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=800&auto=format&fit=crop'],
        description: 'A classic Oxford shirt reimagined with a relaxed, oversized fit.',
        specs: { Fabric: '100% Cotton Oxford', Fit: 'Oversized', Care: 'Machine wash cold', Origin: 'Imported' },
        reviews: []
      },
      {
        id: 'co-001', name: 'Matching Linen Co-Ord', price: 2499, mrp: 3499, category: 'coords', badge: 'New',
        sizes: ['S', 'M', 'L', 'XL'],
        images: ['https://images.unsplash.com/photo-1617137968427-85924c800a22?q=80&w=800&auto=format&fit=crop'],
        description: 'A matching shirt and trouser set in breathable linen-blend fabric.',
        specs: { Fabric: '55% Linen, 45% Cotton', Fit: 'Relaxed', Care: 'Hand wash recommended', Origin: 'Imported' },
        reviews: []
      },
      {
        id: 'tr-002', name: 'Cargo Pants - Olive', price: 999, mrp: 1599, category: 'trousers', badge: 'Surplus',
        sizes: ['30', '32', '34', '36'],
        images: ['https://images.unsplash.com/photo-1517445312882-bc9910d016b7?q=80&w=800&auto=format&fit=crop'],
        description: 'Utility cargo pants in olive green. Multiple pockets and relaxed fit.',
        specs: { Fabric: 'Cotton Twill', Fit: 'Relaxed', Care: 'Machine wash cold', Origin: 'Surplus Stock' },
        reviews: []
      }
    ];

    let state = {
      view: 'home', currentProduct: null, cart: [], wishlist: [], user: null,
      filters: { category: 'all', sort: 'featured' }
    };

    function loadState() {
      try {
        const savedCart = localStorage.getItem('bf_cart');
        if (savedCart) state.cart = JSON.parse(savedCart);
        const savedWish = localStorage.getItem('bf_wishlist');
        if (savedWish) state.wishlist = JSON.parse(savedWish);
        const savedUser = localStorage.getItem('bf_user');
        if (savedUser) state.user = JSON.parse(savedUser);
      } catch (e) { console.error('Error loading state', e); }
    }

    function saveState() {
      try {
        localStorage.setItem('bf_cart', JSON.stringify(state.cart));
        localStorage.setItem('bf_wishlist', JSON.stringify(state.wishlist));
        localStorage.setItem('bf_user', JSON.stringify(state.user));
      } catch (e) { console.error('Error saving state', e); }
    }

    /* =========================================================================
       UTILITIES
       ========================================================================= */

    const formatCurrency = (amount) => '₹' + amount.toLocaleString('en-IN');
    
    const showToast = (msg) => {
      const toast = document.getElementById('toast');
      toast.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="var(--success)" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> ${msg}`;
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2500);
    };

    const toggleWishlist = (id) => {
      const index = state.wishlist.indexOf(id);
      if (index > -1) {
        state.wishlist.splice(index, 1);
        showToast('Removed from wishlist');
      } else {
        state.wishlist.push(id);
        showToast('Added to wishlist');
      }
      saveState();
      renderView();
      
      setTimeout(() => {
        document.querySelectorAll('.wishlist-btn').forEach(btn => {
          if (btn.getAttribute('onclick')?.includes(id)) {
            btn.classList.add('pop');
            setTimeout(() => btn.classList.remove('pop'), 400);
          }
        });
      }, 10);
    };

    const addToCart = (product, size) => {
      if (!size) { showToast('Please select a size'); return; }
      
      const existingItem = state.cart.find(item => item.id === product.id && item.size === size);
      if (existingItem) { existingItem.qty += 1; } 
      else {
        state.cart.push({
          id: product.id, name: product.name, price: product.price,
          image: product.images[0], size: size, qty: 1
        });
      }
      
      saveState();
      updateCartUI();
      showToast(`${product.name} added to bag`);
      
      const badge = document.getElementById('cart-count');
      badge.classList.add('bump');
      setTimeout(() => badge.classList.remove('bump'), 300);
    };

    const removeFromCart = (id, size) => {
      state.cart = state.cart.filter(item => !(item.id === id && item.size === size));
      saveState();
      updateCartUI();
      showToast('Item removed');
    };

    const updateCartQuantity = (id, size, delta) => {
      const item = state.cart.find(item => item.id === id && item.size === size);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) { removeFromCart(id, size); } 
        else { saveState(); updateCartUI(); }
      }
    };

    /* =========================================================================
       CART UI
       ========================================================================= */

    function updateCartUI() {
      const count = state.cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').textContent = count;

      const container = document.getElementById('cart-items');
      
      if (state.cart.length === 0) {
        container.innerHTML = `
          <div class="cart-empty">
            <p style="margin-bottom:20px;">Your bag is empty.</p>
            <button class="btn btn-outline btn-sm" onclick="closeCart(); navigate('shop')"><span>Continue Shopping</span></button>
          </div>
        `;
        document.getElementById('cart-subtotal').textContent = '₹0';
        document.getElementById('cart-total').textContent = '₹0';
        return;
      }

      let subtotal = 0;
      container.innerHTML = state.cart.map(item => {
        subtotal += item.price * item.qty;
        return `
          <div class="cart-item">
            <div class="cart-item-img"><img src="${item.image}" alt="${item.name}"></div>
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <p>Size: ${item.size}</p>
              <div class="cart-item-price">${formatCurrency(item.price)}</div>
              <div class="cart-item-actions">
                <button class="qty-btn" onclick="updateCartQuantity('${item.id}', '${item.size}', -1)">−</button>
                <span style="font-size:0.85rem; font-weight:600; font-family:var(--font-sans);">${item.qty}</span>
                <button class="qty-btn" onclick="updateCartQuantity('${item.id}', '${item.size}', 1)">+</button>
                <button class="remove-btn" onclick="removeFromCart('${item.id}', '${item.size}')">Remove</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-subtotal').textContent = formatCurrency(subtotal);
      document.getElementById('cart-total').textContent = formatCurrency(subtotal);
    }

    function openCart() {
      document.getElementById('cart-drawer').classList.add('active');
      document.getElementById('cart-overlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeCart() {
      document.getElementById('cart-drawer').classList.remove('active');
      document.getElementById('cart-overlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    /* =========================================================================
       MODAL UI
       ========================================================================= */

    function openModal(title, contentHTML) {
      document.getElementById('modal-body').innerHTML = `
        <h3>${title}</h3>
        ${contentHTML}
      `;
      document.getElementById('modal-overlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('modal-overlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    function handleCheckout() {
      openModal('Checkout — Coming Soon', `
        <p>We are currently preparing our online checkout experience.</p>
        <p>In the meantime, you can visit our store to make a purchase.</p>
        <p style="font-size:0.85rem; color:var(--muted);">Store: Aara Machine Road, near Valmiki Mandir, Fish Market, Bhopal.</p>
        <button class="btn btn-primary" style="width:100%" onclick="closeModal()"><span>Continue Browsing</span></button>
      `);
    }

    function handleBuyNow(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      if (!product) return;
      if (!selectedSize) { showToast('Please select a size'); return; }
      
      addToCart(product, selectedSize);
      selectedSize = null;
      
      openCart();
      setTimeout(() => {
        openModal('Purchase — Coming Soon', `
          <p>Online purchasing is coming soon. You can continue exploring our collection.</p>
          <p>Your item has been added to your bag.</p>
          <button class="btn btn-primary" style="width:100%" onclick="closeModal()"><span>Continue Browsing</span></button>
        `);
      }, 400);
    }

    function handleARTeaser() {
      openModal('AR Experience — Coming Soon', `
        <p>An exciting new way to explore your favourite looks is coming soon.</p>
        <p>Our augmented reality try-on feature will let you see how our pieces fit in your space before you buy.</p>
        <button class="btn btn-primary" style="width:100%" onclick="closeModal()"><span>Got it</span></button>
      `);
    }

    /* =========================================================================
       AUTHENTICATION
       ========================================================================= */

    function handleAuthClick() {
      if (state.user) { navigate('account'); } 
      else { navigate('login'); }
    }

    function handleLogin(email, role) {
      state.user = { email, role };
      saveState();
      showToast(`Logged in as ${role}`);
      
      if (role === 'admin') navigate('admin-dashboard');
      else if (role === 'contributor') navigate('contributor-dashboard');
      else navigate('account');
    }

    function handleLogout() {
      state.user = null;
      saveState();
      showToast('Logged out');
      navigate('home');
    }

    /* =========================================================================
       ROUTING & VIEW RENDERING
       ========================================================================= */

    function navigate(view, params = {}) {
      state.view = view;
      if (view === 'product') {
        state.currentProduct = PRODUCTS.find(p => p.id === params.id);
        selectedSize = null;
      }
      if (view === 'shop') {
        if (params.cat) state.filters.category = params.cat;
      }
      
      renderView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderView() {
      const app = document.getElementById('app');
      const count = state.cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').textContent = count;

      const authBtn = document.getElementById('auth-btn');
      if (state.user) {
        authBtn.style.background = 'var(--ink)';
        authBtn.style.color = '#fff';
        authBtn.innerHTML = `<span style="font-size:0.75rem; font-weight:700; font-family:var(--font-sans);">${state.user.email[0].toUpperCase()}</span>`;
      } else {

    /* =========================================================================

    function initScrollAnimations() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.product-card, .section-header, .pdp-info, .pdp-gallery').forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(30px)';
        el.style.transition = 'opacity 0.7s ease-out, transform 0.7s ease-out';
        
        observer.observe(el);
      });
    }

    // Override the observer callback to apply the visible class with styles
    const originalIntersectionObserver = window.IntersectionObserver;
    window.IntersectionObserver = function(callback, options) {
      return new originalIntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'translateY(0)';
          }
        });
        callback(entries);
      }, options);
    };

    function toggleMobileMenu() {
      showToast('Mobile menu clicked');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeCart(); closeModal(); }
    });

    window.addEventListener('scroll', () => {
      const navbar = document.getElementById('navbar');
      const backToTop = document.getElementById('back-to-top');
      
      if (window.scrollY > 50) { navbar.classList.add('scrolled'); } 
      else { navbar.classList.remove('scrolled'); }

      if (window.scrollY > 400) { backToTop.classList.add('visible'); } 
      else { backToTop.classList.remove('visible'); }
    });
