<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAGGY FOREVER — Premium Streetwear</title>
  <meta name="description" content="Discover curated premium streetwear, vintage finds, and everyday essentials at BAGGY FOREVER. Bhopal, India." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <style>
    /* ===== DESIGN SYSTEM ===== */
    :root {
      --bg: #f4f2ed;
      --bg-alt: #e8e4db;
      --surface: #ffffff;
      --ink: #111111;
      --ink-light: #3d3d3d;
      --muted: #7a7a7a;
      --line: #d4cfc4;
      --accent: #ff3b1f;
      --accent-dark: #cc2e18;
      --success: #2e7d32;
      --danger: #d32f2f;
      
      --font-display: 'Anton', sans-serif;
      --font-sans: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      
      --r-sm: 2px;
      --r-md: 4px;
      --r-lg: 8px;
      
      --space-xs: 8px;
      --space-sm: 16px;
      --space-md: 24px;
      --space-lg: 48px;
      --space-xl: 96px;
      
      --sh-sm: 0 2px 8px rgba(0,0,0,0.04);
      --sh-md: 0 8px 24px rgba(0,0,0,0.08);
      --sh-lg: 0 16px 48px rgba(0,0,0,0.12);
      
      --ease: cubic-bezier(0.25, 1, 0.5, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      
      --dur-fast: 200ms;
      --dur-med: 400ms;
      --dur-slow: 700ms;
      
      --nav-height: 72px;
    }

    /* ===== RESET & UTILS ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body.no-scroll { overflow: hidden; }

    h1, h2, h3, h4 { font-weight: 400; line-height: 1.05; color: var(--ink); font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; }
    h1 { font-size: clamp(3rem, 8vw, 7rem); }
    h2 { font-size: clamp(2.2rem, 5vw, 4rem); }
    h3 { font-size: clamp(1.5rem, 3vw, 2.2rem); }
    
    a { color: inherit; text-decoration: none; transition: color var(--dur-fast) var(--ease); }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    img { display: block; max-width: 100%; }
    input, textarea, select { font-family: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    .container { max-width: 1440px; margin: 0 auto; padding: 0 var(--space-md); }
    .text-center { text-align: center; }
    .hidden { display: none !important; }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 16px 32px; font-family: var(--font-sans); font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      border-radius: var(--r-sm); transition: all var(--dur-fast) var(--ease); cursor: pointer;
      position: relative; overflow: hidden;
    }
    .btn-primary { background: var(--ink); color: #fff; border: 1px solid var(--ink); }
    .btn-primary::after {
      content: ''; position: absolute; inset: 0; background: var(--accent);
      transform: translateY(100%); transition: transform var(--dur-fast) var(--ease); z-index: 1;
    }
    .btn-primary:hover::after { transform: translateY(0); }
    .btn-primary span { position: relative; z-index: 2; }
    
    .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
    .btn-outline:hover { background: var(--ink); color: #fff; }
    
    .btn-accent { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
    .btn-accent:hover { background: var(--accent-dark); border-color: var(--accent-dark); transform: translateY(-2px); box-shadow: var(--sh-md); }
    
    .btn-sm { padding: 12px 24px; font-size: 0.7rem; }

    /* ===== NAVIGATION ===== */
    .navbar {
      position: sticky; top: 0; height: var(--nav-height);
      background: rgba(244, 242, 237, 0.92); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line); z-index: 90;
      transition: transform var(--dur-med) var(--ease), box-shadow var(--dur-med) var(--ease);
    }
    .navbar.scrolled { background: rgba(244, 242, 237, 0.98); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .navbar-inner {
      max-width: 1440px; margin: 0 auto; padding: 0 var(--space-md);
      height: 100%; display: flex; align-items: center; justify-content: space-between;
    }
    .brand-logo {
      font-family: var(--font-display); font-size: 1.8rem; letter-spacing: 0.02em;
      text-transform: uppercase; cursor: pointer; display: flex; align-items: baseline; gap: 2px;
    }
    .brand-logo span { color: var(--accent); }
    
    .nav-links { display: flex; gap: var(--space-lg); align-items: center; }
    .nav-links a {
      font-family: var(--font-sans); font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; position: relative; padding: 8px 0; cursor: pointer;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 0;
      height: 2px; background: var(--accent); transition: width var(--dur-fast) var(--ease);
    }
    .nav-links a:hover::after { width: 100%; }

    .nav-actions { display: flex; gap: 4px; align-items: center; }
    .icon-btn {
      width: 44px; height: 44px; display: grid; place-items: center;
      border-radius: 50%; transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease-spring);
      position: relative;
    }
    .icon-btn:hover { background: var(--bg-alt); transform: scale(1.08); }
    .icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; }
    
    .cart-count {
      position: absolute; top: 4px; right: 4px; background: var(--accent); color: #fff;
      font-family: var(--font-sans); font-size: 0.6rem; font-weight: 700; width: 18px; height: 18px;
      border-radius: 50%; display: grid; place-items: center;
      transition: transform var(--dur-fast) var(--ease-spring);
    }
    .cart-count.bump { animation: badgeBump var(--dur-fast) var(--ease-spring); }
    @keyframes badgeBump { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }

    /* ===== HERO ===== */
    .hero {
      position: relative; height: calc(100vh - var(--nav-height)); min-height: 650px;
      max-height: 950px; background: var(--ink); overflow: hidden;
      display: flex; align-items: center;
    }
    .hero-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; opacity: 0.85; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(17,17,17,0.85) 0%, rgba(17,17,17,0.4) 60%, transparent 100%); }
    .hero-content {
      position: relative; z-index: 2; max-width: 700px;
      padding: var(--space-xl) var(--space-lg); color: #fff;
    }
    .hero-subtitle { 
      font-family: var(--font-sans); font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase; 
      color: var(--accent); margin-bottom: var(--space-sm); display: block; 
      opacity: 0; animation: slideUp 0.8s var(--ease-out) 0.2s forwards; 
    }
    .hero-title { margin-bottom: var(--space-md); color: #fff; opacity: 0; animation: slideUp 0.8s var(--ease-out) 0.4s forwards; }
    .hero-title span { color: var(--accent); }
    .hero-desc { 
      font-family: var(--font-body); font-size: 1.1rem; color: rgba(255,255,255,0.8); 
      margin-bottom: var(--space-lg); max-width: 500px; line-height: 1.7; 
      opacity: 0; animation: slideUp 0.8s var(--ease-out) 0.6s forwards; 
    }
    .hero-actions { display: flex; gap: var(--space-sm); flex-wrap: wrap; opacity: 0; animation: slideUp 0.8s var(--ease-out) 0.8s forwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== SECTIONS & GRID ===== */
    .section { padding: var(--space-xl) 0; }
    .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--space-lg); flex-wrap: wrap; gap: var(--space-md); }
    .section-header h2 { margin-bottom: 8px; }
    .section-header p { color: var(--muted); font-family: var(--font-body); font-size: 0.95rem; max-width: 500px; }

    .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-md); }
    @media (max-width: 1024px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .product-grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-sm); } }

    .product-card {
      background: var(--surface); border-radius: var(--r-md); overflow: hidden;
      transition: transform var(--dur-med) var(--ease), box-shadow var(--dur-med) var(--ease);
      cursor: pointer; display: flex; flex-direction: column; position: relative;
      border: 1px solid transparent;
    }
    .product-card:hover { transform: translateY(-8px); box-shadow: var(--sh-md); border-color: var(--line); }
    .product-image-wrapper { position: relative; aspect-ratio: 4/5; background: var(--bg-alt); overflow: hidden; }
    .product-image-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--dur-slow) var(--ease); }
    .product-card:hover .product-image-wrapper img { transform: scale(1.06); }
    
    .product-badge {
      position: absolute; top: 16px; left: 16px; background: var(--accent); color: #fff;
      font-family: var(--font-sans); font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; 
      text-transform: uppercase; padding: 5px 12px; border-radius: var(--r-sm); z-index: 2;
    }
    
    .wishlist-btn {
      position: absolute; top: 12px; right: 12px; width: 40px; height: 40px;
      border-radius: 50%; background: rgba(255,255,255,0.95); backdrop-filter: blur(4px);
      display: grid; place-items: center; transition: all var(--dur-fast) var(--ease); z-index: 2;
      opacity: 0; transform: translateY(-8px);
    }
    .product-card:hover .wishlist-btn { opacity: 1; transform: translateY(0); }
    .wishlist-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; }
    .wishlist-btn.active svg { fill: var(--accent); stroke: var(--accent); }

    .product-info { padding: var(--space-md); display: flex; flex-direction: column; flex: 1; }
    .product-name { font-family: var(--font-sans); font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; }
    .product-category { font-family: var(--font-body); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: var(--space-sm); }
    .product-price { font-family: var(--font-sans); font-weight: 700; font-size: 1.1rem; margin-top: auto; }
    .product-price s { color: var(--muted); font-weight: 400; font-size: 0.85rem; margin-left: 8px; }

    /* ===== PDP ===== */
    .pdp-layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xl); padding-top: var(--space-lg); }
    @media (max-width: 900px) { .pdp-layout { grid-template-columns: 1fr; } }
    .pdp-gallery { position: sticky; top: calc(var(--nav-height) + var(--space-md)); }
    .pdp-main-image { width: 100%; aspect-ratio: 4/5; background: var(--bg-alt); border-radius: var(--r-md); overflow: hidden; margin-bottom: var(--space-sm); }
    .pdp-main-image img { width: 100%; height: 100%; object-fit: cover; }
    .pdp-thumbnails { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .pdp-thumb { aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; cursor: pointer; border: 2px solid transparent; opacity: 0.6; }
    .pdp-thumb.active { border-color: var(--ink); opacity: 1; }
    .pdp-thumb img { width: 100%; height: 100%; object-fit: cover; }
    
    .breadcrumb { font-family: var(--font-sans); font-size: 0.8rem; color: var(--muted); margin-bottom: var(--space-md); display: flex; gap: 8px; }
    .breadcrumb a:hover { color: var(--ink); cursor: pointer; }
    .pdp-title { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: var(--space-xs); }
    .pdp-price { font-family: var(--font-sans); font-size: 1.6rem; font-weight: 700; margin-bottom: var(--space-md); color: var(--accent); }
    .pdp-price s { color: var(--muted); font-size: 1rem; font-weight: 400; margin-left: 12px; }
    .pdp-desc { color: var(--ink-light); line-height: 1.8; margin-bottom: var(--space-lg); }
    
    .size-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .size-btn {
      min-width: 52px; height: 52px; border: 1px solid var(--line); border-radius: var(--r-sm);
      display: grid; place-items: center; font-family: var(--font-sans); font-weight: 600; transition: all var(--dur-fast) var(--ease);
    }
    .size-btn:hover { border-color: var(--ink); }
    .size-btn.selected { background: var(--ink); color: #fff; border-color: var(--ink); }
    
    .pdp-actions { display: flex; gap: var(--space-sm); margin: var(--space-lg) 0; }
    .pdp-actions .btn { flex: 1; padding: 20px; }

    /* ===== AR TRY-ON ===== */
    .ar-teaser { background: var(--bg-alt); border: 1px dashed var(--line); border-radius: var(--r-md); padding: var(--space-md); text-align: center; margin-bottom: var(--space-lg); }
    .ar-teaser h4 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 6px; color: var(--accent); }
    .ar-teaser p { font-family: var(--font-body); font-size: 0.9rem; color: var(--muted); margin-bottom: 14px; }
    
    .tryon-stage {
      position: relative; width: 100%; aspect-ratio: 3/4; background: var(--bg-alt);
      border-radius: 14px; overflow: hidden; margin-bottom: 16px; display: grid; place-items: center;
    }
    .tryon-stage img.base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .tryon-stage img.garment {
      position: absolute; object-fit: contain; cursor: move; user-select: none;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.22)); transition: transform .05s linear;
    }
    .tryon-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .tryon-controls label { font-size: 9.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 5px; }
    .tryon-controls input[type=range] { width: 100%; accent-color: var(--accent); }

    /* ===== DRAWERS & MODALS ===== */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      z-index: 200; opacity: 0; visibility: hidden; transition: opacity var(--dur-med) var(--ease), visibility var(--dur-med);
    }
    .overlay.active { opacity: 1; visibility: visible; }

    /* Cart Drawer */
    .cart-drawer {
      position: fixed; top: 0; right: 0; width: 100%; max-width: 460px; height: 100vh;
      background: var(--surface); z-index: 210; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform var(--dur-med) var(--ease-out);
      visibility: hidden;
    }
    .cart-drawer.active { transform: translateX(0); visibility: visible; }
    .cart-header { padding: var(--space-md); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .cart-items { flex: 1; overflow-y: auto; padding: var(--space-md); }
    .cart-item { display: flex; gap: var(--space-sm); padding: var(--space-sm) 0; border-bottom: 1px solid var(--line); }
    .cart-item-img { width: 80px; height: 100px; border-radius: var(--r-sm); overflow: hidden; background: var(--bg-alt); }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-info { flex: 1; }
    .cart-item-info h4 { font-family: var(--font-sans); font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
    .cart-item-info p { font-size: 0.85rem; color: var(--muted); }
    .cart-footer { padding: var(--space-md); border-top: 1px solid var(--line); background: var(--bg); }
    .cart-total-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
    .cart-total-row.grand-total { font-size: 1.2rem; font-weight: 700; margin: var(--space-sm) 0; padding-top: var(--space-sm); border-top: 1px solid var(--line); }
    .qty-btn { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: var(--r-sm); display: grid; place-items: center; }
    .remove-btn { font-size: 0.75rem; color: var(--muted); text-decoration: underline; margin-left: auto; }

    /* Generic Modal & Auth Modal */
    .modal {
      position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: var(--space-md);
      opacity: 0; visibility: hidden; transition: opacity var(--dur-med) var(--ease), visibility var(--dur-med);
    }
    .modal.active { opacity: 1; visibility: visible; }
    .modal-content {
      background: var(--surface); border-radius: var(--r-lg); width: 100%; max-width: 480px;
      padding: var(--space-lg); position: relative; transform: translateY(20px);
      transition: transform var(--dur-med) var(--ease-out); box-shadow: var(--sh-lg);
      max-height: 90vh; overflow-y: auto;
    }
    .modal.active .modal-content { transform: translateY(0); }
    .modal-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; display: grid; place-items: center; font-size: 1.5rem; color: var(--muted); border-radius: 50%; }
    .modal-close:hover { background: var(--bg-alt); color: var(--ink); }

    /* Auth Specific */
    .form-group { margin-bottom: var(--space-sm); }
    .form-group label { display: block; font-family: var(--font-sans); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-sm); font-family: var(--font-body); font-size: 0.95rem; }
    .form-group input:focus { outline: none; border-color: var(--ink); }
    .password-wrapper { position: relative; }
    .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 0.75rem; font-weight: 600; color: var(--muted); cursor: pointer; text-transform: uppercase; }
    
    /* Mobile Nav */
    .mobile-nav {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: var(--bg);
      z-index: 250; padding: var(--space-lg); display: flex; flex-direction: column;
      transform: translateX(-100%); transition: transform var(--dur-med) var(--ease-out); visibility: hidden;
    }
    .mobile-nav.active { transform: translateX(0); visibility: visible; }
    .mobile-nav-links { display: flex; flex-direction: column; gap: var(--space-md); margin-top: var(--space-lg); }
    .mobile-nav-links a { font-family: var(--font-display); font-size: 2rem; text-transform: uppercase; }

    /* Search Overlay */
    .search-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: var(--bg);
      z-index: 250; padding: var(--space-lg); display: flex; flex-direction: column;
      opacity: 0; visibility: hidden; transition: opacity var(--dur-med) var(--ease), visibility var(--dur-med);
    }
    .search-overlay.active { opacity: 1; visibility: visible; }
    .search-input { width: 100%; padding: 20px; font-size: 1.5rem; background: transparent; border: none; border-bottom: 2px solid var(--ink); font-family: var(--font-sans); margin-top: var(--space-lg); }
    .search-input:focus { outline: none; }
    .search-results { margin-top: var(--space-lg); display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-md); overflow-y: auto; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 120px);
      background: var(--ink); color: #fff; padding: 14px 28px; border-radius: 50px;
      font-family: var(--font-sans); font-size: 0.85rem; font-weight: 500; z-index: 400; 
      opacity: 0; transition: all var(--dur-med) var(--ease-spring); pointer-events: none;
    }
    .toast.active { opacity: 1; transform: translate(-50%, 0); }

    /* Policy Pages / Modals */
    .policy-content h2 { font-size: 2rem; margin-bottom: 16px; }
    .policy-content h3 { font-family: var(--font-sans); font-size: 1.1rem; font-weight: 700; margin-top: 24px; margin-bottom: 8px; text-transform: none; }
    .policy-content p { font-family: var(--font-body); color: var(--ink-light); line-height: 1.7; margin-bottom: 12px; }
    .policy-content ul { margin-left: 20px; margin-bottom: 16px; color: var(--ink-light); font-family: var(--font-body); line-height: 1.7; }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hero-title { font-size: 3rem; }
      .product-grid { grid-template-columns: repeat(2, 1fr); }
      .pdp-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <header class="navbar" id="navbar">
    <div class="navbar-inner">
      <div class="brand-logo" onclick="navigate('home')">
        BAGGY<span>FOREVER</span>
      </div>
      
      <nav class="nav-links">
        <a onclick="navigate('home')">Home</a>
        <a onclick="navigate('shop')">Shop All</a>
        <a onclick="navigate('shop', {cat: 'tshirts'})">T-Shirts</a>
        <a onclick="navigate('shop', {cat: 'hoodies'})">Hoodies</a>
        <a onclick="navigate('about')">About</a>
      </nav>

      <div class="nav-actions">
        <button class="icon-btn" onclick="openSearch()" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <button class="icon-btn" onclick="openAuthModal()" aria-label="Account" id="auth-btn">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
        <button class="icon-btn" onclick="openCart()" aria-label="Shopping Bag">
          <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 01-8 0"></path></svg>
          <span class="cart-count" id="cart-count">0</span>
        </button>
        <button class="icon-btn" onclick="openMobileNav()" aria-label="Menu" style="display:none;" id="mobile-menu-btn">
          <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN APP -->
  <main id="app"></main>

  <!-- OVERLAYS & DRAWERS -->
  <div class="overlay" id="overlay" onclick="closeAll()"></div>

  <!-- CART DRAWER -->
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3 style="font-family: var(--font-display); font-size:1.5rem;">Shopping Bag</h3>
      <button class="modal-close" onclick="closeCart()" style="position:static;">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total-row"><span>Subtotal</span><span id="cart-subtotal">₹0</span></div>
      <div class="cart-total-row grand-total"><span>Total</span><span id="cart-total">₹0</span></div>
      <button class="btn btn-accent" style="width:100%" onclick="handleCheckout()"><span>CHECKOUT — DEMO</span></button>
      <p style="text-align:center; font-size:0.75rem; color:var(--muted); margin-top:12px;">Online purchasing integration required.</p>
    </div>
  </aside>

  <!-- GENERIC MODAL -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="modal-body" class="policy-content"></div>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAuthModal()">&times;</button>
      <div id="auth-body"></div>
    </div>
  </div>

  <!-- MOBILE NAV -->
  <div class="mobile-nav" id="mobile-nav">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="brand-logo">BAGGY<span>FOREVER</span></div>
      <button class="modal-close" onclick="closeMobileNav()" style="position:static;">&times;</button>
    </div>
    <nav class="mobile-nav-links">
      <a onclick="navigate('home'); closeMobileNav();">Home</a>
      <a onclick="navigate('shop'); closeMobileNav();">Shop All</a>
      <a onclick="navigate('shop', {cat: 'tshirts'}); closeMobileNav();">T-Shirts</a>
      <a onclick="navigate('shop', {cat: 'hoodies'}); closeMobileNav();">Hoodies</a>
      <a onclick="navigate('about'); closeMobileNav();">About</a>
    </nav>
  </div>

  <!-- SEARCH OVERLAY -->
  <div class="search-overlay" id="search-overlay">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-family:var(--font-display); font-size:2rem;">Search</h2>
      <button class="modal-close" onclick="closeSearch()" style="position:static; font-size:2rem;">&times;</button>
    </div>
    <input type="text" class="search-input" id="search-input" placeholder="Search products..." oninput="handleSearch(this.value)">
    <div class="search-results" id="search-results"></div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    /* =========================================================================
       DATA & STATE (Now using your local images)
       ========================================================================= */
    const PRODUCTS = [
      { 
        id: 'ts-001', 
        name: 'Oversized Heavyweight Tee', 
        price: 799, 
        mrp: 1200, 
        category: 'tshirts', 
        badge: 'New', 
        sizes: ['S', 'M', 'L', 'XL'], 
        images: [
          'assets/images/Screenshot_20261028_155953_Amazon.jpg', 
          'assets/images/Screenshot_20261028_160114_Amazon.jpg'
        ], 
        description: 'Premium heavyweight cotton tee with a relaxed, oversized fit.', 
        specs: { Fabric: '100% Cotton', Fit: 'Oversized' } 
      },
      { 
        id: 'hd-001', 
        name: 'Black Harocott Hoodie', 
        price: 1200, 
        mrp: 1800, 
        category: 'hoodies', 
        badge: 'New', 
        sizes: ['S', 'M', 'L', 'XL'], 
        images: [
          'assets/images/Screenshot_20261028_160206_Amazon.jpg',
          'assets/images/Screenshot_20261028_160315_Amazon.jpg'
        ], 
        description: 'Premium heavyweight cotton hoodie with custom sleeve print.', 
        specs: { Fabric: 'Cotton Fleece', Fit: 'Relaxed' } 
      },
      { 
        id: 'tr-001', 
        name: 'Baggy Fit Denim', 
        price: 1499, 
        mrp: 2199, 
        category: 'trousers', 
        badge: 'New', 
        sizes: ['30', '32', '34', '36'], 
        images: [
          'assets/images/Screenshot_20261028_160442_Amazon.jpg',
          'assets/images/Screenshot_20261028_160632_Amazon.jpg'
        ], 
        description: 'Ultra-relaxed baggy denim with a vintage wash.', 
        specs: { Fabric: '100% Cotton', Fit: 'Baggy' } 
      },
      { 
        id: 'jk-001', 
        name: 'Classic Denim Jacket', 
        price: 1699, 
        mrp: 2499, 
        category: 'jackets', 
        badge: 'New', 
        sizes: ['S', 'M', 'L'], 
        images: [
          'assets/images/Screenshot_20261028_160837_Amazon.jpg',
          'assets/images/Screenshot_20261028_161037_Amazon.jpg'
        ], 
        description: 'Timeless denim jacket with a modern oversized fit.', 
        specs: { Fabric: 'Cotton Denim', Fit: 'Oversized' } 
      }
    ];

    let state = {
      view: 'home', currentProduct: null, cart: [], wishlist: [], user: null,
      filters: { category: 'all', sort: 'featured' }
    };

    function loadState() {
      try {
        const c = localStorage.getItem('bf_cart'); if (c) state.cart = JSON.parse(c);
        const w = localStorage.getItem('bf_wishlist'); if (w) state.wishlist = JSON.parse(w);
        const u = localStorage.getItem('bf_user'); if (u) state.user = JSON.parse(u);
      } catch (e) { console.error('State load error', e); }
    }

    function saveState() {
      localStorage.setItem('bf_cart', JSON.stringify(state.cart));
      localStorage.setItem('bf_wishlist', JSON.stringify(state.wishlist));
      localStorage.setItem('bf_user', JSON.stringify(state.user));
    }

    const formatCurrency = (n) => '₹' + n.toLocaleString('en-IN');
    
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('active');
      setTimeout(() => t.classList.remove('active'), 2500);
    }

    /* =========================================================================
       MODAL & OVERLAY MANAGEMENT
       ========================================================================= */
    function openOverlay() {
      document.getElementById('overlay').classList.add('active');
      document.body.classList.add('no-scroll');
    }

    function closeAll() {
      document.getElementById('overlay').classList.remove('active');
      document.getElementById('cart-drawer').classList.remove('active');
      document.getElementById('modal').classList.remove('active');
      document.getElementById('auth-modal').classList.remove('active');
      document.getElementById('mobile-nav').classList.remove('active');
      document.getElementById('search-overlay').classList.remove('active');
      document.body.classList.remove('no-scroll');
    }

    function openCart() {
      renderCart();
      document.getElementById('cart-drawer').classList.add('active');
      openOverlay();
    }
    function closeCart() { closeAll(); }

    function openMobileNav() {
      document.getElementById('mobile-nav').classList.add('active');
      openOverlay();
    }
    function closeMobileNav() { closeAll(); }

    function openSearch() {
      document.getElementById('search-overlay').classList.add('active');
      openOverlay();
      document.getElementById('search-input').focus();
      handleSearch('');
    }
    function closeSearch() { closeAll(); }

    function handleSearch(query) {
      const results = document.getElementById('search-results');
      const q = query.toLowerCase();
      const filtered = PRODUCTS.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
      
      if (filtered.length === 0) {
        results.innerHTML = `<p style="font-family:var(--font-body); color:var(--muted);">No products found.</p>`;
        return;
      }
      
      results.innerHTML = filtered.map(p => `
        <div class="product-card" onclick="navigate('product', {id:'${p.id}'}); closeSearch();">
          <div class="product-image-wrapper">
            <img src="${p.images[0]}" alt="${p.name}" />
          </div>
          <div class="product-info">
            <h3 class="product-name">${p.name}</h3>
            <div class="product-price">${formatCurrency(p.price)}</div>
          </div>
        </div>
      `).join('');
    }

    function openModal(title, html) {
      document.getElementById('modal-body').innerHTML = `<h2 style="font-family:var(--font-display); font-size:2rem; margin-bottom:16px;">${title}</h2>${html}`;
      document.getElementById('modal').classList.add('active');
      openOverlay();
    }
    function closeModal() { closeAll(); }

    /* =========================================================================
       AUTHENTICATION (Demo Mode)
       ========================================================================= */
    function openAuthModal() {
      if (state.user) { navigate('account'); return; }
      renderAuthModal('login');
      document.getElementById('auth-modal').classList.add('active');
      openOverlay();
    }

    function closeAuthModal() { closeAll(); }

    function renderAuthModal(tab) {
      const body = document.getElementById('auth-body');
      if (tab === 'login') {
        body.innerHTML = `
          <h3 style="font-family:var(--font-display); font-size:1.8rem; margin-bottom:20px; text-align:center;">Welcome Back</h3>
          <form onsubmit="event.preventDefault(); handleLogin();">
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="login-email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
              <label>Password</label>
              <div class="password-wrapper">
                <input type="password" id="login-password" placeholder="••••••••" required />
                <span class="toggle-password" onclick="togglePassword('login-password')">Show</span>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:12px;"><span>Sign In</span></button>
          </form>
          <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--muted);">
            Don't have an account? <a onclick="renderAuthModal('register')" style="color:var(--accent); font-weight:600; cursor:pointer;">Create one</a>
          </div>
          <div style="margin-top:20px; padding:12px; background:var(--bg-alt); border-radius:var(--r-sm); font-size:0.75rem; text-align:center; color:var(--muted);">
            Demo Admin: admin@baggyforever.com / admin123
          </div>
        `;
      } else {
        body.innerHTML = `
          <h3 style="font-family:var(--font-display); font-size:1.8rem; margin-bottom:20px; text-align:center;">Create Account</h3>
          <form onsubmit="event.preventDefault(); handleRegister();">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="reg-name" placeholder="Your Name" required />
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="reg-email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
              <label>Password</label>
              <div class="password-wrapper">
                <input type="password" id="reg-password" placeholder="••••••••" required minlength="6" />
                <span class="toggle-password" onclick="togglePassword('reg-password')">Show</span>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:12px;"><span>Create Account</span></button>
          </form>
          <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--muted);">
            Already have an account? <a onclick="renderAuthModal('login')" style="color:var(--accent); font-weight:600; cursor:pointer;">Sign In</a>
          </div>
        `;
      }
    }

    function togglePassword(id) {
      const input = document.getElementById(id);
      if (input.type === 'password') { input.type = 'text'; event.target.textContent = 'Hide'; }
      else { input.type = 'password'; event.target.textContent = 'Show'; }
    }

    function handleLogin() {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      
      if (email === 'admin@baggyforever.com' && pass === 'admin123') {
        state.user = { email, role: 'admin' };
        saveState();
        closeAuthModal();
        showToast('Logged in as Administrator');
        navigate('admin-dashboard');
      } else if (email && pass.length >= 6) {
        state.user = { email, role: 'customer' };
        saveState();
        closeAuthModal();
        showToast('Logged in successfully');
        navigate('account');
      } else {
        showToast('Invalid credentials. Password must be 6+ chars.');
      }
      updateAuthBtn();
    }

    function handleRegister() {
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-password').value;
      if (email && pass.length >= 6) {
        state.user = { email, role: 'customer' };
        saveState();
        closeAuthModal();
        showToast('Account created successfully');
        navigate('account');
      } else {
        showToast('Please fill all fields correctly.');
      }
      updateAuthBtn();
    }

    function logout() {
      state.user = null;
      saveState();
      updateAuthBtn();
      navigate('home');
      showToast('Logged out');
    }

    function updateAuthBtn() {
      const btn = document.getElementById('auth-btn');
      if (state.user) {
        btn.style.background = 'var(--ink)';
        btn.innerHTML = `<span style="font-size:0.7rem; font-weight:700; color:#fff;">${state.user.email[0].toUpperCase()}</span>`;
      } else {
        btn.style.background = '';
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
      }
    }

    /* =========================================================================
       CART & WISHLIST
       ========================================================================= */
    function addToCart(product, size) {
      if (!size) { showToast('Please select a size'); return; }
      const existing = state.cart.find(i => i.id === product.id && i.size === size);
      if (existing) { existing.qty += 1; }
      else { state.cart.push({ id: product.id, name: product.name, price: product.price, image: product.images[0], size, qty: 1 }); }
      
      saveState();
      updateCartCount();
      renderCart();
      showToast('Added to bag');
      
      const badge = document.getElementById('cart-count');
      badge.classList.add('bump');
      setTimeout(() => badge.classList.remove('bump'), 300);
    }

    function updateCartCount() {
      const count = state.cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').textContent = count;
    }

    function renderCart() {
      const box = document.getElementById('cart-items');
      if (state.cart.length === 0) {
        box.innerHTML = `<div style="text-align:center; padding:40px 0; color:var(--muted);"><p>Your bag is empty.</p><button class="btn btn-outline btn-sm" onclick="closeCart(); navigate('shop');" style="margin-top:16px;"><span>Shop Now</span></button></div>`;
        document.getElementById('cart-subtotal').textContent = '₹0';
        document.getElementById('cart-total').textContent = '₹0';
        return;
      }
      
      let subtotal = 0;
      box.innerHTML = state.cart.map(item => {
        subtotal += item.price * item.qty;
        return `
          <div class="cart-item">
            <div class="cart-item-img"><img src="${item.image}" alt="${item.name}"></div>
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <p>Size: ${item.size}</p>
              <div style="font-weight:700; color:var(--accent); margin-top:4px;">${formatCurrency(item.price)}</div>
              <div style="display:flex; align-items:center; gap:8px; margin-top:8px;">
                <button class="qty-btn" onclick="updateQty('${item.id}', '${item.size}', -1)">−</button>
                <span>${item.qty}</span>
                <button class="qty-btn" onclick="updateQty('${item.id}', '${item.size}', 1)">+</button>
                <button class="remove-btn" onclick="removeCartItem('${item.id}', '${item.size}')">Remove</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
      
      document.getElementById('cart-subtotal').textContent = formatCurrency(subtotal);
      document.getElementById('cart-total').textContent = formatCurrency(subtotal);
    }

    function updateQty(id, size, delta) {
      const item = state.cart.find(i => i.id === id && i.size === size);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) { removeCartItem(id, size); }
        else { saveState(); renderCart(); updateCartCount(); }
      }
    }

    function removeCartItem(id, size) {
      state.cart = state.cart.filter(i => !(i.id === id && i.size === size));
      saveState(); renderCart(); updateCartCount();
    }

    function toggleWishlist(id) {
      const idx = state.wishlist.indexOf(id);
      if (idx > -1) { state.wishlist.splice(idx, 1); showToast('Removed from wishlist'); }
      else { state.wishlist.push(id); showToast('Added to wishlist'); }
      saveState();
      renderView();
    }

    function handleCheckout() {
      openModal('Checkout', `<p>We are currently preparing our online checkout experience. In the meantime, you can visit our store to make a purchase.</p><button class="btn btn-primary" style="width:100%; margin-top:16px;" onclick="closeModal()"><span>Continue Browsing</span></button>`);
    }

    /* =========================================================================
       ROUTING & VIEWS
       ========================================================================= */
    let selectedSize = null;

    function navigate(view, params = {}) {
      state.view = view;
      if (view === 'product') {
        state.currentProduct = PRODUCTS.find(p => p.id === params.id);
        selectedSize = null;
      }
      if (view === 'shop' && params.cat) { state.filters.category = params.cat; }
      
      renderView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderView() {
      const app = document.getElementById('app');
      updateAuthBtn();
      updateCartCount();

      if (state.view === 'home') app.innerHTML = renderHome();
      else if (state.view === 'shop') app.innerHTML = renderShop();
      else if (state.view === 'product') app.innerHTML = renderProduct(state.currentProduct);
      else if (state.view === 'about') app.innerHTML = renderAbout();
      else if (state.view === 'account') app.innerHTML = renderAccount();
      else if (state.view === 'admin-dashboard') app.innerHTML = renderAdminDashboard();
      else app.innerHTML = render404();

      initScrollAnimations();
    }

    function renderHome() {
      return `
        <section class="hero">
          <!-- Using your local product image as the hero background -->
          <img src="assets/images/Screenshot_20261028_160206_Amazon.jpg" alt="Hero" class="hero-image" />
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <span class="hero-subtitle">The New Collection</span>
            <h1 class="hero-title">STYLE THAT<br><span>SPEAKS.</span></h1>
            <p class="hero-desc">Discover curated vintage, premium streetwear, and everyday essentials.</p>
            <div class="hero-actions">
              <button class="btn btn-accent" onclick="navigate('shop')"><span>Explore Collection</span></button>
            </div>
          </div>
        </section>
        
        <section class="section container">
          <div class="section-header">
            <div><h2>New Arrivals</h2><p>Fresh pieces added to our collection.</p></div>
            <button class="btn btn-outline btn-sm" onclick="navigate('shop')"><span>View All</span></button>
          </div>
          <div class="product-grid">
            ${PRODUCTS.filter(p => p.badge === 'New').map(p => renderCard(p)).join('')}
          </div>
        </section>
        ${renderFooter()}
      `;
    }

    function renderShop() {
      let filtered = [...PRODUCTS];
      if (state.filters.category !== 'all') filtered = filtered.filter(p => p.category === state.filters.category);
      
      return `
        <div class="container" style="padding-top:var(--space-lg); padding-bottom:var(--space-xl);">
          <div class="section-header">
            <div><h2>Shop All</h2></div>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-outline btn-sm ${state.filters.category === 'all' ? 'active' : ''}" onclick="state.filters.category='all'; renderView();"><span>All</span></button>
              <button class="btn btn-outline btn-sm ${state.filters.category === 'tshirts' ? 'active' : ''}" onclick="state.filters.category='tshirts'; renderView();"><span>T-Shirts</span></button>
              <button class="btn btn-outline btn-sm ${state.filters.category === 'hoodies' ? 'active' : ''}" onclick="state.filters.category='hoodies'; renderView();"><span>Hoodies</span></button>
            </div>
          </div>
          <div class="product-grid">
            ${filtered.map(p => renderCard(p)).join('')}
          </div>
        </div>
        ${renderFooter()}
      `;
    }

    function renderCard(p) {
      const wished = state.wishlist.includes(p.id);
      return `
        <div class="product-card" onclick="navigate('product', {id:'${p.id}'})">
          <div class="product-image-wrapper">
            <img src="${p.images[0]}" alt="${p.name}" loading="lazy" />
            ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
            <button class="wishlist-btn ${wished ? 'active' : ''}" onclick="event.stopPropagation(); toggleWishlist('${p.id}')">
              <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
          </div>
          <div class="product-info">
            <h3 class="product-name">${p.name}</h3>
            <span class="product-category">${p.category}</span>
            <div class="product-price">${formatCurrency(p.price)} <s>${formatCurrency(p.mrp)}</s></div>
          </div>
        </div>
      `;
    }

    function renderProduct(p) {
      if (!p) return render404();
      return `
        <div class="container" style="padding:var(--space-lg) 0;">
          <div class="breadcrumb"><a onclick="navigate('home')">Home</a> / <a onclick="navigate('shop')">Shop</a> / <span>${p.name}</span></div>
          <div class="pdp-layout">
            <div class="pdp-gallery">
              <div class="pdp-main-image"><img src="${p.images[0]}" id="main-img" /></div>
              <div class="pdp-thumbnails">
                ${p.images.map((img, i) => `<div class="pdp-thumb ${i===0?'active':''}" onclick="document.getElementById('main-img').src='${img}'; document.querySelectorAll('.pdp-thumb').forEach(t=>t.classList.remove('active')); this.classList.add('active');"><img src="${img}"></div>`).join('')}
              </div>
            </div>
            <div>
              <h1 class="pdp-title">${p.name}</h1>
              <div class="pdp-price">${formatCurrency(p.price)} <s>${formatCurrency(p.mrp)}</s></div>
              <p class="pdp-desc">${p.description}</p>
              <div class="pdp-options">
                <h4 style="font-family:var(--font-sans); font-size:0.8rem; font-weight:700; text-transform:uppercase; margin-bottom:8px;">Select Size</h4>
                <div class="size-selector">
                  ${p.sizes.map(s => `<button class="size-btn" onclick="selectSize('${s}', this)">${s}</button>`).join('')}
                </div>
              </div>
              <div class="pdp-actions">
                <button class="btn btn-primary" onclick="handleAddToCart('${p.id}')"><span>Add to Bag</span></button>
                <button class="btn btn-outline" onclick="toggleWishlist('${p.id}')"><span>Wishlist</span></button>
              </div>
              
              <!-- AR Teaser -->
              <div class="ar-teaser">
                <h4>✨ AR Try-On Coming Soon</h4>
                <p>Preview this piece in your space before you buy.</p>
                <button class="btn btn-outline btn-sm" onclick="openARModal('${p.id}')"><span>Preview Try-On</span></button>
              </div>
              
            </div>
          </div>
        </div>
        ${renderFooter()}
      `;
    }

    function selectSize(size, btn) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function handleAddToCart(id) {
      const p = PRODUCTS.find(x => x.id === id);
      addToCart(p, selectedSize);
    }
    
    /* =========================================================================
       AR TRY-ON MODAL
       ========================================================================= */
    function openARModal(id) {
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) return;
      
      const modalBody = document.getElementById('modal-body');
      modalBody.innerHTML = `
        <h3 style="font-family:var(--font-display); font-size:1.8rem; margin-bottom:12px;">Virtual Try-On</h3>
        <p style="margin-bottom:16px;">Upload a photo, then drag and scale the garment to preview it. Preview only.</p>
        <div class="tryon-stage" id="tryonStage">
          <div class="tryon-empty" id="tryonEmpty" style="text-align:center;">
            📷<br/><br/>Upload a photo to start<br/>
            <input type="file" id="tryonUpload" accept="image/*" style="margin-top:14px;font-size:12px" />
          </div>
        </div>
        <div class="tryon-controls" id="tryonControls" style="display:none">
          <div><label>Scale</label><input type="range" id="trScale" min="0.3" max="2.5" step="0.05" value="1" /></div>
          <div><label>Opacity</label><input type="range" id="trOpacity" min="0.2" max="1" step="0.05" value="0.9" /></div>
          <div><label>X Position</label><input type="range" id="trX" min="-150" max="150" step="1" value="0" /></div>
          <div><label>Y Position</label><input type="range" id="trY" min="-150" max="150" step="1" value="0" /></div>
        </div>
        <button class="btn btn-primary" style="width:100%; margin-top:12px;" onclick="closeModal()"><span>Close</span></button>
      `;
      
      document.getElementById('modal').classList.add('active');
      openOverlay();
      
      const upload = document.getElementById('tryonUpload');
      upload.addEventListener('change', e => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const stage = document.getElementById('tryonStage');
          stage.innerHTML = `
            <img class="base" src="${ev.target.result}" alt="Your photo" />
            <img class="garment" id="garmentImg" src="${p.images[0]}" alt="${p.name}" />
          `;
          document.getElementById('tryonEmpty')?.remove();
          document.getElementById('tryonControls').style.display = 'grid';
          setupGarmentDrag();
        };
        reader.readAsDataURL(file);
      });
    }
    
    function setupGarmentDrag() {
      const garment = document.getElementById('garmentImg');
      if(!garment) return;
      
      let state = { scale: 1, x: 0, y: 0, opacity: 0.9 };
      
      const apply = () => {
        garment.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
        garment.style.opacity = state.opacity;
      };
      
      garment.style.width = '55%';
      garment.style.height = '55%';
      garment.style.top = '22%';
      garment.style.left = '22%';
      apply();
      
      document.getElementById('trScale').addEventListener('input', e => { state.scale = Number(e.target.value); apply(); });
      document.getElementById('trOpacity').addEventListener('input', e => { state.opacity = Number(e.target.value); apply(); });
      document.getElementById('trX').addEventListener('input', e => { state.x = Number(e.target.value); apply(); });
      document.getElementById('trY').addEventListener('input', e => { state.y = Number(e.target.value); apply(); });
      
      let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
      garment.addEventListener('pointerdown', e => {
        dragging = true;
        sx = e.clientX; sy = e.clientY;
        ox = state.x; oy = state.y;
        garment.setPointerCapture(e.pointerId);
      });
      garment.addEventListener('pointermove', e => {
        if(!dragging) return;
        state.x = ox + (e.clientX - sx);
        state.y = oy + (e.clientY - sy);
        document.getElementById('trX').value = state.x;
        document.getElementById('trY').value = state.y;
        apply();
      });
      garment.addEventListener('pointerup', () => dragging = false);
    }

      return `<div class="container text-center" style="padding:100px 0;"><h1>404</h1><p>Page not found.</p><button class="btn btn-primary" onclick="navigate('home')" style="margin-top:20px;"><span>Go Home</span></button></div>`;

    function renderFooter() {

            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:var(--space-lg); margin-bottom:var(--space-lg);">
              <div>
                <h3 style="font-family:var(--font-display); font-size:1.5rem; margin-bottom:12px;">BAGGY FOREVER</h3>
                <p style="font-family:var(--font-body); font-size:0.9rem; color:rgba(255,255,255,0.6);">Curated fashion for the modern individual.</p>
              </div>
              <div>
                <h4 style="font-family:var(--font-sans); font-size:0.8rem; font-weight:700; color:var(--accent); margin-bottom:12px; text-transform:uppercase;">Shop</h4>
                <a onclick="navigate('shop')" style="display:block; font-family:var(--font-body); font-size:0.9rem; color:rgba(255,255,255,0.6); margin-bottom:8px; cursor:pointer;">All Products</a>
                <a onclick="navigate('shop', {cat: 'tshirts'})" style="display:block; font-family:var(--font-body); font-size:0.9rem; color:rgba(255,255,255,0.6); margin-bottom:8px; cursor:pointer;">T-Shirts</a>
                <a onclick="navigate('shop', {cat: 'hoodies'})" style="display:block; font-family:var(--font-body); font-size:0.9rem; color:rgba(255,255,255,0.6); margin-bottom:8px; cursor:pointer;">Hoodies</a>
              </div>
              <div>
                <h4 style="font-family:var(--font-sans); font-size:0.8rem; font-weight:700; color:var(--accent); margin-bottom:12px; text-transform:uppercase;">Support</h4>
                <a onclick="openPolicy('FAQ')" style="display:block; font-family:var(--font-body); font-size:0.9rem; color:rgba(255,255,255,0.6); margin-bottom:8px; cursor:pointer;">FAQ</a>
                <a onclick="openPolicy('Shipping')" style="display:block; font-family:var(--font-body); font-size:0.9rem; color:rgba(255,255,255,0.6); margin-bottom:8px; cursor:pointer;">Shipping Policy</a>
                <a onclick="openPolicy('Returns')" style="display:block; font-family:var(--font-body); font-size:0.9rem; color:rgba(255,255,255,0.6); margin-bottom:8px; cursor:pointer;">Returns & Refunds</a>
              </div>
              <div>
                <h4 style="font-family:var(--font-sans); font-size:0.8rem; font-weight:700; color:var(--accent); margin-bottom:12px; text-transform:uppercase;">Visit Us</h4>
                <p style="font-family:var(--font-body); font-size:0.9rem; color:rgba(255,255,255,0.6); line-height:1.6;">Aara Machine Road, near Valmiki Mandir, Bhopal.</p>
              </div>
            </div>
            <div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
              <span style="font-size:0.8rem; color:rgba(255,255,255,0.4);">&copy; 2026 BAGGY FOREVER.</span>
              <div style="display:flex; gap:16px;">
                <a onclick="openPolicy('Privacy')" style="font-size:0.8rem; color:rgba(255,255,255,0.4); cursor:pointer;">Privacy</a>
                <a onclick="openPolicy('Terms')" style="font-size:0.8rem; color:rgba(255,255,255,0.4); cursor:pointer;">Terms</a>
              </div>

    /* =========================================================================
       POLICY MODALS
       ========================================================================= */
    function openPolicy(type) {
      let title = '', html = '';
      if (type === 'FAQ') {
        title = 'Frequently Asked Questions';
        html = `
          <h3>How do I select a size?</h3>
          <p>On any product page, select your preferred size before adding to the bag.</p>
          <h3>Is online purchasing available?</h3>
          <p>Online checkout is coming soon. You can currently add items to your bag to prepare your order.</p>
          <h3>Where is the physical store?</h3>
          <p>We are located at Aara Machine Road, near Valmiki Mandir, Bhopal.</p>
        `;
      } else if (type === 'Shipping') {
        title = 'Shipping Policy';
        html = `
          <p>Currently, all orders are processed for local pickup at our Bhopal store. Nationwide shipping options will be updated here once online checkout is live.</p>
          <p style="color:var(--danger);">[Owner Note: Final shipping timelines and costs must be updated based on actual courier partnerships.]</p>
        `;
      } else if (type === 'Returns') {
        title = 'Returns & Refunds';
        html = `
          <p>We want you to love your purchase. If you have an issue with your item, please contact us directly at the store.</p>
          <p style="color:var(--danger);">[Owner Note: Final return window (e.g., 7 or 14 days) and condition requirements must be specified here.]</p>
        `;
      } else if (type === 'Privacy') {
        title = 'Privacy Policy';
        html = `
          <p>Your privacy is important to us. This demo website stores your cart and wishlist locally in your browser. No personal data is transmitted to a server at this time.</p>
          <p style="color:var(--danger);">[Owner Note: A full privacy policy is required once user accounts and backend analytics are connected.]</p>
        `;
      } else if (type === 'Terms') {
        title = 'Terms & Conditions';
        html = `
          <p>By using this website, you agree to browse the catalogue and interact with the shopping features for demonstration purposes.</p>
          <p style="color:var(--danger);">[Owner Note: Full legal terms of service must be reviewed by a legal professional before going live.]</p>
        `;
      }
      openModal(title, html);
    }

    /* =========================================================================
       ANIMATIONS & UTILS
       ========================================================================= */
    function initScrollAnimations() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'translateY(0)';
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.product-card, .section-header').forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(30px)';
        el.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
        observer.observe(el);
      });
    }

    window.addEventListener('scroll', () => {
      const nav = document.getElementById('navbar');
      if (window.scrollY > 50) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    });

    if (window.innerWidth <= 768) {
      document.getElementById('mobile-menu-btn').style.display = 'grid';
    }
    window.addEventListener('resize', () => {
      document.getElementById('mobile-menu-btn').style.display = window.innerWidth <= 768 ? 'grid' : 'none';
    });

    // Close overlays on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAll();
    });

    // INIT
    loadState();
    renderView();
  </script>
