<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAGGY FOREVER — Premium Fashion</title>
  <meta name="description" content="Discover curated fashion at BAGGY FOREVER. Shop premium streetwear, vintage finds, and everyday essentials." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    /* ===== DESIGN SYSTEM ===== */
    :root {
      --bg: #faf9f7;
      --bg-alt: #f2efe9;
      --surface: #ffffff;
      --ink: #1a1a1a;
      --ink-light: #4a4a4a;
      --muted: #7a7a7a;
      --line: #e5e0d8;
      --accent: #1a1a1a;
      --danger: #d32f2f;
      --success: #2e7d32;
      
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Anton', sans-serif;
      
      --r-sm: 4px;
      --r-md: 8px;
      --r-lg: 16px;
      --space-xs: 8px;
      --space-sm: 16px;
      --space-md: 24px;
      --space-lg: 48px;
      --space-xl: 80px;
      
      --sh-sm: 0 2px 8px rgba(0,0,0,0.04);
      --sh-md: 0 8px 24px rgba(0,0,0,0.08);
      --sh-lg: 0 16px 48px rgba(0,0,0,0.12);
      
      --ease: cubic-bezier(0.25, 1, 0.5, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      
      --nav-height: 80px;
    }

    /* ===== RESET ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Typography */
    h1, h2, h3, h4 { font-weight: 400; line-height: 1.1; color: var(--ink); }
    h1, h2, h3 { font-family: var(--font-serif); }
    h1 { font-size: clamp(2.5rem, 5vw, 4.5rem); }
    h2 { font-size: clamp(2rem, 4vw, 3rem); }
    h3 { font-size: clamp(1.5rem, 2.5vw, 2rem); }
    
    a { color: inherit; text-decoration: none; transition: color 0.3s var(--ease); }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    img { display: block; max-width: 100%; }
    input, textarea, select { font-family: inherit; }
    ::selection { background: var(--ink); color: var(--bg); }

    /* Utilities */
    .container { max-width: 1440px; margin: 0 auto; padding: 0 var(--space-md); }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .hidden { display: none !important; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 28px; font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      border-radius: var(--r-sm); transition: all 0.3s var(--ease); cursor: pointer;
    }
    .btn-primary { background: var(--ink); color: var(--surface); border: 1px solid var(--ink); }
    .btn-primary:hover { background: #333; border-color: #333; transform: translateY(-2px); }
    .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
    .btn-outline:hover { background: var(--ink); color: var(--surface); transform: translateY(-2px); }
    .btn-sm { padding: 10px 20px; font-size: 0.7rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ===== NAVIGATION ===== */
    .navbar {
      position: sticky; top: 0; height: var(--nav-height);
      background: rgba(250, 249, 247, 0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line); z-index: 90;
    }
    .navbar-inner {
      max-width: 1440px; margin: 0 auto; padding: 0 var(--space-md);
      height: 100%; display: flex; align-items: center; justify-content: space-between;
    }
    .brand-logo {
      font-family: var(--font-display); font-size: 1.6rem; letter-spacing: 0.05em;
      text-transform: uppercase; cursor: pointer; display: flex; align-items: baseline; gap: 2px;
    }
    .brand-logo span { color: var(--muted); font-weight: 300; }
    
    .nav-links { display: flex; gap: var(--space-lg); align-items: center; }
    .nav-links a {
      font-size: 0.8rem; font-weight: 500; letter-spacing: 0.05em;
      text-transform: uppercase; position: relative; padding: 8px 0;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 0;
      height: 1px; background: var(--ink); transition: width 0.3s var(--ease);
    }
    .nav-links a:hover::after { width: 100%; }

    .nav-actions { display: flex; gap: var(--space-sm); align-items: center; }
    .icon-btn {
      width: 40px; height: 40px; display: grid; place-items: center;
      border-radius: 50%; transition: background 0.2s; position: relative;
    }
    .icon-btn:hover { background: var(--bg-alt); }
    .icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.5; }
    
    .cart-count {
      position: absolute; top: 2px; right: 2px; background: var(--ink); color: var(--surface);
      font-size: 0.6rem; font-weight: 700; width: 16px; height: 16px;
      border-radius: 50%; display: grid; place-items: center;
    }
    .mobile-menu-btn { display: none; }

    /* ===== HERO ===== */
    .hero {
      position: relative; height: calc(100vh - var(--nav-height)); min-height: 600px;
      max-height: 900px; background: var(--bg-alt); overflow: hidden;
      display: flex; align-items: center;
    }
    .hero-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(250,249,247,0.9) 0%, rgba(250,249,247,0.4) 50%, transparent 100%); }
    .hero-content {
      position: relative; z-index: 2; max-width: 600px;
      padding: var(--space-xl) var(--space-lg); animation: fadeUp 1s var(--ease-out) forwards;
      opacity: 0; transform: translateY(30px);
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .hero-subtitle { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: var(--space-sm); display: block; }
    .hero-title { margin-bottom: var(--space-md); }
    .hero-title em { font-style: italic; font-weight: 600; }
    .hero-desc { font-size: 1.1rem; color: var(--ink-light); margin-bottom: var(--space-lg); max-width: 450px; line-height: 1.6; }
    .hero-actions { display: flex; gap: var(--space-sm); flex-wrap: wrap; }

    /* ===== SECTIONS ===== */
    .section { padding: var(--space-xl) 0; }
    .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--space-lg); flex-wrap: wrap; gap: var(--space-md); }
    .section-header h2 { margin-bottom: 8px; }
    .section-header p { color: var(--muted); font-size: 0.95rem; max-width: 500px; }

    /* ===== PRODUCT GRID ===== */
    .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-md); }
    @media (max-width: 1024px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .product-grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-sm); } }

    .product-card {
      background: var(--surface); border-radius: var(--r-md); overflow: hidden;
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
      cursor: pointer; display: flex; flex-direction: column;
    }
    .product-card:hover { transform: translateY(-4px); box-shadow: var(--sh-md); }
    .product-image-wrapper { position: relative; aspect-ratio: 4/5; background: var(--bg-alt); overflow: hidden; }
    .product-image-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s var(--ease); }
    .product-card:hover .product-image-wrapper img { transform: scale(1.03); }
    
    .product-badge {
      position: absolute; top: 12px; left: 12px; background: var(--surface); color: var(--ink);
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 4px 10px; border-radius: var(--r-sm); box-shadow: var(--sh-sm);
    }
    
    .wishlist-btn {
      position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
      border-radius: 50%; background: rgba(255,255,255,0.9);
      display: grid; place-items: center; transition: all 0.2s; z-index: 2;
    }
    .wishlist-btn:hover { background: var(--surface); transform: scale(1.1); }
    .wishlist-btn svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.5; transition: all 0.2s; }
    .wishlist-btn.active svg { fill: var(--ink); }

    .product-info { padding: var(--space-sm); display: flex; flex-direction: column; flex: 1; }
    .product-name { font-family: var(--font-sans); font-size: 0.9rem; font-weight: 500; margin-bottom: 4px; color: var(--ink); line-height: 1.4; }
    .product-category { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--space-xs); }
    .product-price { font-weight: 600; font-size: 1rem; margin-top: auto; }
    .product-price s { color: var(--muted); font-weight: 400; font-size: 0.85rem; margin-left: 8px; }

    /* ===== SHOP PAGE ===== */
    .shop-layout { display: grid; grid-template-columns: 240px 1fr; gap: var(--space-xl); align-items: start; }
    @media (max-width: 900px) { .shop-layout { grid-template-columns: 1fr; gap: var(--space-md); } .filters-sidebar { display: none; } }
    
    .filters-sidebar { position: sticky; top: calc(var(--nav-height) + var(--space-md)); }
    .filter-group { margin-bottom: var(--space-md); padding-bottom: var(--space-md); border-bottom: 1px solid var(--line); }
    .filter-group h4 { font-family: var(--font-sans); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--space-sm); }
    .filter-list { display: flex; flex-direction: column; gap: 8px; }
    .filter-list label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--ink-light); cursor: pointer; }
    .filter-list input[type="checkbox"] { accent-color: var(--ink); width: 16px; height: 16px; }
    
    .shop-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); flex-wrap: wrap; gap: var(--space-sm); }
    .sort-select { padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: 0.85rem; color: var(--ink); cursor: pointer; }

    /* ===== PRODUCT DETAIL ===== */
    .pdp-layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xl); padding-top: var(--space-lg); }
    @media (max-width: 900px) { .pdp-layout { grid-template-columns: 1fr; gap: var(--space-lg); } }
    
    .pdp-gallery { position: sticky; top: calc(var(--nav-height) + var(--space-md)); }
    .pdp-main-image { width: 100%; aspect-ratio: 4/5; background: var(--bg-alt); border-radius: var(--r-md); overflow: hidden; margin-bottom: var(--space-sm); }
    .pdp-main-image img { width: 100%; height: 100%; object-fit: cover; }
    
    .pdp-info { padding-top: var(--space-sm); }
    .breadcrumb { font-size: 0.8rem; color: var(--muted); margin-bottom: var(--space-md); display: flex; gap: 8px; align-items: center; }
    .breadcrumb a { color: var(--muted); } .breadcrumb a:hover { color: var(--ink); } .breadcrumb span { color: var(--ink); }
    
    .pdp-title { font-size: clamp(2rem, 3.5vw, 2.8rem); margin-bottom: var(--space-xs); }
    .pdp-price { font-size: 1.4rem; font-weight: 500; margin-bottom: var(--space-md); }
    .pdp-price s { color: var(--muted); font-size: 1rem; font-weight: 400; margin-left: 12px; }
    .pdp-desc { color: var(--ink-light); line-height: 1.7; margin-bottom: var(--space-lg); font-size: 1rem; }
    
    .pdp-options { margin-bottom: var(--space-lg); }
    .pdp-options h4 { font-family: var(--font-sans); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .size-selector { display: flex; gap: 8px; flex-wrap: wrap; }
    .size-btn {
      min-width: 48px; height: 48px; border: 1px solid var(--line); border-radius: var(--r-sm);
      display: grid; place-items: center; font-weight: 500; transition: all 0.2s;
    }
    .size-btn:hover { border-color: var(--ink); }
    .size-btn.selected { background: var(--ink); color: var(--surface); border-color: var(--ink); }
    
    .pdp-actions { display: flex; gap: var(--space-sm); margin-bottom: var(--space-lg); }
    .pdp-actions .btn-primary { flex: 1; padding: 18px; font-size: 0.85rem; }
    .pdp-actions .btn-outline { flex: 1; padding: 18px; font-size: 0.85rem; }
    
    .pdp-ar-teaser { background: var(--bg-alt); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--space-md); text-align: center; margin-bottom: var(--space-lg); }
    .pdp-ar-teaser h4 { font-family: var(--font-serif); font-size: 1.3rem; margin-bottom: 4px; }
    .pdp-ar-teaser p { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
    
    .pdp-specs { border-top: 1px solid var(--line); padding-top: var(--space-md); margin-top: var(--space-md); }
    .spec-row { display: flex; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
    .spec-row .label { width: 120px; color: var(--muted); flex-shrink: 0; }
    .spec-row .value { font-weight: 500; color: var(--ink); }

    /* ===== REVIEWS ===== */
    .reviews-section { margin-top: var(--space-xl); padding-top: var(--space-lg); border-top: 1px solid var(--line); }
    .review-list { display: grid; gap: var(--space-md); margin-top: var(--space-md); }
    .review-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--space-md); }
    .review-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .review-author { font-weight: 600; } .review-date { color: var(--muted); font-size: 0.85rem; }
    .review-stars { color: var(--ink); margin-bottom: 8px; letter-spacing: 2px; }
    .review-text { color: var(--ink-light); font-size: 0.95rem; line-height: 1.6; }

    /* ===== FOOTER ===== */
    .footer { background: var(--surface); border-top: 1px solid var(--line); padding: var(--space-xl) 0 var(--space-md); }
    .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: var(--space-lg); margin-bottom: var(--space-lg); }
    @media (max-width: 768px) { .footer-grid { grid-template-columns: 1fr; gap: var(--space-md); } }
    
    .footer-brand h3 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: var(--space-sm); }
    .footer-brand p { color: var(--muted); font-size: 0.9rem; max-width: 300px; line-height: 1.6; }
    
    .footer-col h4 { font-family: var(--font-sans); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--space-sm); }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .footer-col a { font-size: 0.9rem; color: var(--muted); } .footer-col a:hover { color: var(--ink); }
    
    .footer-bottom { border-top: 1px solid var(--line); padding-top: var(--space-md); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-sm); font-size: 0.8rem; color: var(--muted); }

    /* ===== CART DRAWER ===== */
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .cart-overlay.active { opacity: 1; pointer-events: all; }
    
    .cart-drawer {
      position: fixed; top: 0; right: 0; width: 100%; max-width: 440px; height: 100vh;
      background: var(--surface); z-index: 210; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform 0.4s var(--ease-out); box-shadow: var(--sh-lg);
    }
    .cart-drawer.active { transform: translateX(0); }
    
    .cart-header { padding: var(--space-md); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .cart-header h3 { font-family: var(--font-serif); font-size: 1.5rem; }
    
    .cart-items { flex: 1; overflow-y: auto; padding: var(--space-md); }
    .cart-empty { text-align: center; padding: var(--space-xl) var(--space-md); color: var(--muted); }
    .cart-item { display: flex; gap: var(--space-sm); padding: var(--space-sm) 0; border-bottom: 1px solid var(--line); }
    .cart-item-img { width: 80px; height: 100px; border-radius: var(--r-sm); overflow: hidden; background: var(--bg-alt); }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-info { flex: 1; }
    .cart-item-info h4 { font-family: var(--font-sans); font-size: 0.9rem; font-weight: 500; margin-bottom: 4px; }
    .cart-item-info p { font-size: 0.85rem; color: var(--muted); }
    .cart-item-price { font-weight: 600; margin-top: 8px; }
    
    .cart-item-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .qty-btn { width: 24px; height: 24px; border: 1px solid var(--line); border-radius: var(--r-sm); display: grid; place-items: center; font-size: 1rem; }
    .qty-btn:hover { border-color: var(--ink); }
    .remove-btn { margin-left: auto; font-size: 0.75rem; color: var(--muted); text-decoration: underline; }

    .cart-footer { padding: var(--space-md); border-top: 1px solid var(--line); background: var(--bg); }
    .cart-total-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; color: var(--ink-light); }
    .cart-total-row.grand-total { font-size: 1.1rem; font-weight: 600; color: var(--ink); margin: var(--space-sm) 0; padding-top: var(--space-sm); border-top: 1px solid var(--line); }

    /* ===== MODALS ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      z-index: 300; display: grid; place-items: center; padding: var(--space-md);
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    
    .modal-content {
      background: var(--surface); border-radius: var(--r-lg); width: 100%; max-width: 500px;
      padding: var(--space-lg); position: relative; transform: translateY(20px);
      transition: transform 0.3s var(--ease-out);
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    
    .modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; display: grid; place-items: center; font-size: 1.5rem; color: var(--muted); border-radius: 50%; }
    .modal-close:hover { background: var(--bg-alt); color: var(--ink); }
    
    .modal-content h3 { font-family: var(--font-serif); font-size: 1.8rem; margin-bottom: 12px; }
    .modal-content p { color: var(--ink-light); line-height: 1.6; margin-bottom: var(--space-md); }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 100px);
      background: var(--ink); color: var(--surface); padding: 12px 24px; border-radius: 50px;
      font-size: 0.85rem; font-weight: 500; z-index: 400; opacity: 0;
      transition: all 0.4s var(--ease-out); pointer-events: none; box-shadow: var(--sh-md);
    }
    .toast.active { opacity: 1; transform: translate(-50%, 0); }

    /* ===== AUTH / DASHBOARD STYLES ===== */
    .auth-container { max-width: 400px; margin: var(--space-xl) auto; padding: var(--space-lg); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-md); }
    .auth-container h2 { text-align: center; margin-bottom: var(--space-md); }
    .auth-form { display: flex; flex-direction: column; gap: var(--space-sm); }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .form-group input, .form-group select {
      padding: 12px; border: 1px solid var(--line); border-radius: var(--r-sm);
      font-size: 0.95rem; background: var(--bg); transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--ink); }
    .auth-switch { text-align: center; margin-top: var(--space-md); font-size: 0.85rem; color: var(--muted); }
    .auth-switch a { color: var(--ink); font-weight: 600; cursor: pointer; }
    .auth-switch a:hover { text-decoration: underline; }
    
    .dashboard-container { display: grid; grid-template-columns: 250px 1fr; gap: var(--space-lg); padding: var(--space-lg) 0; min-height: 80vh; }
    @media (max-width: 768px) { .dashboard-container { grid-template-columns: 1fr; } }
    
    .dashboard-sidebar { background: var(--surface); border-radius: var(--r-md); padding: var(--space-md); border: 1px solid var(--line); height: fit-content; }
    .dashboard-sidebar h3 { font-size: 1.1rem; margin-bottom: var(--space-sm); border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    .dashboard-nav { display: flex; flex-direction: column; gap: 4px; }
    .dashboard-nav a {
      padding: 10px 12px; border-radius: var(--r-sm); font-size: 0.9rem;
      transition: background 0.2s; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .dashboard-nav a:hover, .dashboard-nav a.active { background: var(--bg-alt); font-weight: 500; }
    
    .dashboard-main { background: var(--surface); border-radius: var(--r-md); padding: var(--space-lg); border: 1px solid var(--line); }
    .dashboard-main h2 { margin-bottom: var(--space-md); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-md); margin-bottom: var(--space-lg); }
    .stat-card { background: var(--bg); padding: var(--space-md); border-radius: var(--r-md); text-align: center; }
    .stat-card .number { font-size: 2rem; font-weight: 700; font-family: var(--font-serif); }
    .stat-card .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .admin-table { width: 100%; border-collapse: collapse; margin-top: var(--space-md); }
    .admin-table th, .admin-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
    .admin-table th { font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; color: var(--muted); }
    .admin-table tr:hover { background: var(--bg-alt); }

    /* ===== ANIMATIONS ===== */
    .fade-in { opacity: 0; transform: translateY(20px); transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out); }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      :root { --space-xl: 48px; --space-lg: 32px; }
      .nav-links { display: none; }
      .mobile-menu-btn { display: grid; }
      .navbar-inner { padding: 0 var(--space-sm); }
      .hero-content { padding: var(--space-lg) var(--space-md); }
      .pdp-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <header class="navbar">
    <div class="navbar-inner">
      <div class="brand-logo" onclick="navigate('home')">
        BAGGY<span>FOREVER</span>
      </div>
      
      <nav class="nav-links">
        <a onclick="navigate('home')">Home</a>
        <a onclick="navigate('shop')">Shop All</a>
        <a onclick="navigate('shop', {cat: 'new'})">New Arrivals</a>
        <a onclick="navigate('about')">About</a>
        <a onclick="navigate('contact')">Contact</a>
      </nav>

      <div class="nav-actions">
        <!-- Account / Login Button -->
        <button class="icon-btn" onclick="handleAuthClick()" aria-label="Account" id="auth-btn">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
        
        <button class="icon-btn" onclick="openCart()" aria-label="Shopping Bag">
          <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 01-8 0"></path></svg>
          <span class="cart-count" id="cart-count">0</span>
        </button>
        
        <button class="icon-btn mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
          <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main id="app"></main>

  <!-- CART DRAWER -->
  <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>Shopping Bag</h3>
      <button class="modal-close" onclick="closeCart()" aria-label="Close Cart">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total-row"><span>Subtotal</span><span id="cart-subtotal">₹0</span></div>
      <div class="cart-total-row"><span>Shipping</span><span>Calculated at checkout</span></div>
      <div class="cart-total-row grand-total"><span>Total</span><span id="cart-total">₹0</span></div>
      <button class="btn btn-primary" style="width:100%" onclick="handleCheckout()">CHECKOUT — COMING SOON</button>
      <p style="text-align:center; font-size:0.75rem; color:var(--muted); margin-top:12px;">Online purchasing will be available soon.</p>
    </div>
  </aside>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" id="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    /* =========================================================================
       DATA & STATE
       ========================================================================= */
    
    // Product Dataset (Clothing only - no human models)
    const PRODUCTS = [
      {
        id: 'bf-001',
        name: 'Black Harocott Hoodie',
        price: 1200,
        mrp: 1800,
        category: 'new',
        sizes: ['S', 'M', 'L', 'XL'],
        image: 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=800&auto=format&fit=crop',
        description: 'Premium heavyweight cotton hoodie with custom sleeve print. Relaxed fit for everyday wear.',
        specs: { Fabric: '100% Cotton', Fit: 'Oversized', Care: 'Machine wash cold' },
        badge: 'New',
        reviews: [
          { author: 'Rahul S.', date: '2 weeks ago', stars: 5, text: 'Insane quality. The fit is perfect and the material feels premium.' }
        ]
      },
      {
        id: 'bf-002',
        name: 'Brown Zip-Up Set',
        price: 1899,
        mrp: 2800,
        category: 'vintage',
        sizes: ['M', 'L'],
        image: 'https://images.unsplash.com/photo-1617137968427-85924c800a22?q=80&w=800&auto=format&fit=crop',
        description: 'Matching brown zip-up hoodie and wide-leg pants. Vintage-inspired streetwear silhouette.',
        specs: { Fabric: 'Cotton blend', Fit: 'Relaxed', Care: 'Hand wash recommended' },
        badge: 'Rare',
        reviews: [
          { author: 'Aman K.', date: '3 weeks ago', stars: 5, text: 'Exactly as shown. This brand never misses.' }
        ]
      },
      {
        id: 'bf-003',
        name: 'No Mercy Angel Longsleeve',
        price: 899,
        mrp: 1400,
        category: 'thrift',
        sizes: ['S', 'M', 'L', 'XL'],
        image: 'https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?q=80&w=800&auto=format&fit=crop',
        description: 'Oversized longsleeve tee with bold graphic print. Thrifted and curated for unique style.',
        specs: { Fabric: 'Cotton', Fit: 'Oversized', Care: 'Machine wash cold' },
        badge: '1 of 1',
        reviews: []
      },
      {
        id: 'bf-004',
        name: 'Sherpa Fleece Zip Jacket',
        price: 1499,
        mrp: 2200,
        category: 'surplus',
        sizes: ['M', 'L', 'XL'],
        image: 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?q=80&w=800&auto=format&fit=crop',
        description: 'Warm sherpa fleece jacket with color-block design. Perfect for layering in colder months.',
        specs: { Fabric: 'Polyester fleece', Fit: 'Regular', Care: 'Machine wash gentle' },
        badge: 'Surplus',
        reviews: []
      },
      {
        id: 'bf-005',
        name: 'Classic Denim Jacket',
        price: 1699,
        mrp: 2499,
        category: 'new',
        sizes: ['S', 'M', 'L'],
        image: 'https://images.unsplash.com/photo-1576995853123-5a10305d93c0?q=80&w=800&auto=format&fit=crop',
        description: 'Timeless denim jacket with a modern oversized fit. A wardrobe essential.',
        specs: { Fabric: '100% Cotton Denim', Fit: 'Oversized', Care: 'Machine wash cold' },
        badge: 'New',
        reviews: []
      },
      {
        id: 'bf-006',
        name: 'Cargo Pants - Olive',
        price: 999,
        mrp: 1599,
        category: 'surplus',
        sizes: ['30', '32', '34', '36'],
        image: 'https://images.unsplash.com/photo-1517445312882-bc9910d016b7?q=80&w=800&auto=format&fit=crop',
        description: 'Utility cargo pants in olive green. Multiple pockets and relaxed fit.',
        specs: { Fabric: 'Cotton Twill', Fit: 'Relaxed', Care: 'Machine wash cold' },
        badge: 'Surplus',
        reviews: []
      }
    ];

    // State Management
    let state = {
      view: 'home',
      currentProduct: null,
      cart: [],
      wishlist: [],
      user: null, // { email, role }
      filters: { category: 'all', sort: 'featured' }
    };

    // Load state from LocalStorage
    function loadState() {
      try {
        const savedCart = localStorage.getItem('bf_cart');
        if (savedCart) state.cart = JSON.parse(savedCart);
        const savedWish = localStorage.getItem('bf_wishlist');
        if (savedWish) state.wishlist = JSON.parse(savedWish);
        const savedUser = localStorage.getItem('bf_user');
        if (savedUser) state.user = JSON.parse(savedUser);
      } catch (e) { console.error('Error loading state', e); }
    }

    // Save state to LocalStorage
    function saveState() {
      try {
        localStorage.setItem('bf_cart', JSON.stringify(state.cart));
        localStorage.setItem('bf_wishlist', JSON.stringify(state.wishlist));
        localStorage.setItem('bf_user', JSON.stringify(state.user));
      } catch (e) { console.error('Error saving state', e); }
    }

    /* =========================================================================
       UTILITIES
       ========================================================================= */

    const formatCurrency = (amount) => '₹' + amount.toLocaleString('en-IN');
    
    const showToast = (msg) => {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2500);
    };

    const toggleWishlist = (id) => {
      const index = state.wishlist.indexOf(id);
      if (index > -1) {
        state.wishlist.splice(index, 1);
        showToast('Removed from wishlist');
      } else {
        state.wishlist.push(id);
        showToast('Added to wishlist');
      }
      saveState();
      renderView();
    };

    const addToCart = (product, size) => {
      if (!size) { showToast('Please select a size'); return; }
      
      const existingItem = state.cart.find(item => item.id === product.id && item.size === size);
      if (existingItem) {
        existingItem.qty += 1;
      } else {
        state.cart.push({
          id: product.id, name: product.name, price: product.price,
          image: product.image, size: size, qty: 1
        });
      }
      
      saveState();
      updateCartUI();
      showToast(`${product.name} added to bag`);
    };

    const removeFromCart = (id, size) => {
      state.cart = state.cart.filter(item => !(item.id === id && item.size === size));
      saveState();
      updateCartUI();
    };

    const updateCartQuantity = (id, size, delta) => {
      const item = state.cart.find(item => item.id === id && item.size === size);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) { removeFromCart(id, size); } 
        else { saveState(); updateCartUI(); }
      }
    };

    /* =========================================================================
       CART UI
       ========================================================================= */

    function updateCartUI() {
      const count = state.cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').textContent = count;

      const container = document.getElementById('cart-items');
      
      if (state.cart.length === 0) {
        container.innerHTML = `
          <div class="cart-empty">
            <p>Your bag is empty.</p>
            <button class="btn btn-outline btn-sm" style="margin-top:16px" onclick="closeCart(); navigate('shop')">Continue Shopping</button>
          </div>
        `;
        document.getElementById('cart-subtotal').textContent = '₹0';
        document.getElementById('cart-total').textContent = '₹0';
        return;
      }

      let subtotal = 0;
      container.innerHTML = state.cart.map(item => {
        subtotal += item.price * item.qty;
        return `
          <div class="cart-item">
            <div class="cart-item-img"><img src="${item.image}" alt="${item.name}"></div>
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <p>Size: ${item.size}</p>
              <div class="cart-item-price">${formatCurrency(item.price)}</div>
              <div class="cart-item-actions">
                <button class="qty-btn" onclick="updateCartQuantity('${item.id}', '${item.size}', -1)">−</button>
                <span style="font-size:0.85rem; font-weight:500">${item.qty}</span>
                <button class="qty-btn" onclick="updateCartQuantity('${item.id}', '${item.size}', 1)">+</button>
                <button class="remove-btn" onclick="removeFromCart('${item.id}', '${item.size}')">Remove</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-subtotal').textContent = formatCurrency(subtotal);
      document.getElementById('cart-total').textContent = formatCurrency(subtotal);
    }

    function openCart() {
      document.getElementById('cart-drawer').classList.add('active');
      document.getElementById('cart-overlay').classList.add('active');
    }

    function closeCart() {
      document.getElementById('cart-drawer').classList.remove('active');
      document.getElementById('cart-overlay').classList.remove('active');
    }

    /* =========================================================================
       MODAL UI
       ========================================================================= */

    function openModal(title, contentHTML) {
      document.getElementById('modal-body').innerHTML = `
        <h3>${title}</h3>
        ${contentHTML}
      `;
      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('modal-overlay').classList.remove('active');
    }

    function handleCheckout() {
      openModal('Checkout — Coming Soon', `
        <p>We are currently preparing our online checkout experience.</p>
        <p>In the meantime, you can visit our store to make a purchase.</p>
        <button class="btn btn-primary" style="width:100%" onclick="closeModal()">Continue Browsing</button>
      `);
    }

    function handleBuyNow(productId) {
      // Ensure a size is selected
      const product = PRODUCTS.find(p => p.id === productId);
      if (!product) return;
      
      if (!selectedSize) {
        showToast('Please select a size');
        return;
      }
      
      addToCart(product, selectedSize);
      selectedSize = null; // Reset
      
      // Open cart drawer to show the item
      openCart();
      
      // Show coming soon message inside the cart footer (already present)
      // Or open a modal to be explicit
      setTimeout(() => {
        openModal('Purchase — Coming Soon', `
          <p>Online purchasing is coming soon. You can continue exploring our collection.</p>
          <p>Your item has been added to your bag.</p>
          <button class="btn btn-primary" style="width:100%" onclick="closeModal()">Continue Browsing</button>
        `);
      }, 400);
    }

    function handleARTeaser() {
      openModal('AR Experience — Coming Soon', `
        <p>An exciting new way to explore your favourite looks is coming soon.</p>
        <p>Our augmented reality try-on feature will let you see how our pieces fit in your space before you buy.</p>
        <button class="btn btn-primary" style="width:100%" onclick="closeModal()">Got it</button>
      `);
    }

    /* =========================================================================
       AUTHENTICATION & DASHBOARDS
       ========================================================================= */

    function handleAuthClick() {
      if (state.user) {
        navigate('account');
      } else {
        navigate('login');
      }
    }

    function handleLogin(email, role) {
      // Simulated login (frontend only for demonstration)
      // In a real app, this would validate against a backend
      state.user = { email, role };
      saveState();
      showToast(`Logged in as ${role}`);
      
      if (role === 'admin') navigate('admin-dashboard');
      else if (role === 'contributor') navigate('contributor-dashboard');
      else navigate('account');
    }

    function handleLogout() {
      state.user = null;
      saveState();
      showToast('Logged out');
      navigate('home');
    }

    /* =========================================================================
       ROUTING & VIEW RENDERING
       ========================================================================= */

    function navigate(view, params = {}) {
      state.view = view;
      if (view === 'product') {
        state.currentProduct = PRODUCTS.find(p => p.id === params.id);
      }
      if (view === 'shop') {
        if (params.cat) state.filters.category = params.cat;
      }
      
      renderView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderView() {
      const app = document.getElementById('app');
      
      // Update cart badge
      const count = state.cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').textContent = count;

      // Update auth button visual
      const authBtn = document.getElementById('auth-btn');
      if (state.user) {
        authBtn.style.background = 'var(--ink)';
        authBtn.style.color = 'var(--surface)';
        authBtn.innerHTML = `<span style="font-size:0.7rem; font-weight:700;">${state.user.email[0].toUpperCase()}</span>`;
      } else {
        authBtn.style.background = '';
        authBtn.style.color = '';
        authBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
      }

      if (state.view === 'home') {
        app.innerHTML = renderHome();
        initScrollAnimations();
      } 
      else if (state.view === 'shop') {
        app.innerHTML = renderShop();
        initScrollAnimations();
      } 
      else if (state.view === 'product') {
        if (!state.currentProduct) { app.innerHTML = render404(); } 
        else { app.innerHTML = renderProductDetail(state.currentProduct); initScrollAnimations(); }
      } 
      else if (state.view === 'about') {
        app.innerHTML = renderAbout();
      } 
      else if (state.view === 'contact') {
        app.innerHTML = renderContact();
      } 
      else if (state.view === 'login') {
        app.innerHTML = renderLogin();
      }
      else if (state.view === 'register') {
        app.innerHTML = renderRegister();
      }
      else if (state.view === 'account') {
        app.innerHTML = renderAccount();
      }
      else if (state.view === 'admin-dashboard') {
        app.innerHTML = renderAdminDashboard();
      }
      else if (state.view === 'contributor-dashboard') {
        app.innerHTML = renderContributorDashboard();
      }
      else {
        app.innerHTML = render404();
      }
    }

    /* =========================================================================
       VIEWS
       ========================================================================= */

    function renderHome() {
      const featuredProducts = PRODUCTS.slice(0, 4);
      
      return `
        <!-- HERO -->
        <section class="hero">
          <!-- Using a clothing-only image for the hero -->
          <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?q=80&w=1600&auto=format&fit=crop" alt="BAGGY FOREVER Collection" class="hero-image" />
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <span class="hero-subtitle">The New Collection</span>
            <h1 class="hero-title">STYLE THAT<br><em>SPEAKS.</em></h1>
            <p class="hero-desc">
              Discover curated vintage, premium streetwear, and everyday essentials. 
              Each piece is hand-selected for its unique character and quality.
            </p>
            <div class="hero-actions">
              <button class="btn btn-primary" onclick="navigate('shop')">Explore Collection</button>
              <button class="btn btn-outline" onclick="navigate('about')">Discover the Brand</button>
            </div>
          </div>
        </section>

        <!-- NEW ARRIVALS -->
        <section class="section container">
          <div class="section-header">
            <div>
              <h2>New Arrivals</h2>
              <p>Fresh pieces added to our collection.</p>
            </div>
            <button class="btn btn-outline btn-sm" onclick="navigate('shop')">View All</button>
          </div>
          <div class="product-grid">
            ${featuredProducts.map(p => renderProductCard(p)).join('')}
          </div>
        </section>

        <!-- AR TEASER -->
        <section class="section container text-center">
          <div style="max-width: 600px; margin: 0 auto; padding: var(--space-xl) var(--space-md); background: var(--bg-alt); border-radius: var(--r-lg);">
            <h2 style="margin-bottom: 16px;">YOUR STYLE. YOUR SPACE.</h2>
            <p style="color: var(--muted); margin-bottom: 24px;">Discover a new way to explore your favourite pieces. Our AR experience is coming soon.</p>
            <button class="btn btn-primary" onclick="handleARTeaser()">AR EXPERIENCE — COMING SOON</button>
          </div>
        </section>

        <!-- STORE INFO -->
        ${renderStoreInfo()}
      `;
    }

    function renderShop() {
      let filtered = [...PRODUCTS];
      
      if (state.filters.category !== 'all') {
        filtered = filtered.filter(p => p.category === state.filters.category);
      }

      if (state.filters.sort === 'price-low') { filtered.sort((a, b) => a.price - b.price); }
      else if (state.filters.sort === 'price-high') { filtered.sort((a, b) => b.price - a.price); }

      return `
        <div class="container" style="padding-top: var(--space-lg); padding-bottom: var(--space-xl);">
          <div class="section-header">
            <div>
              <h2>Shop All</h2>
              <p>Browse our complete collection of premium fashion.</p>
            </div>
            <div class="shop-toolbar">
              <select class="sort-select" onchange="applySort(this.value)">
                <option value="featured" ${state.filters.sort === 'featured' ? 'selected' : ''}>Featured</option>
                <option value="price-low" ${state.filters.sort === 'price-low' ? 'selected' : ''}>Price: Low to High</option>
                <option value="price-high" ${state.filters.sort === 'price-high' ? 'selected' : ''}>Price: High to Low</option>
              </select>
            </div>
          </div>

          <div class="shop-layout">
            <aside class="filters-sidebar">
              <div class="filter-group">
                <h4>Category</h4>
                <div class="filter-list">
                  <label><input type="checkbox" ${state.filters.category === 'all' ? 'checked' : ''} onchange="applyCategoryFilter('all')"> All Categories</label>
                  <label><input type="checkbox" ${state.filters.category === 'new' ? 'checked' : ''} onchange="applyCategoryFilter('new')"> New Arrivals</label>
                  <label><input type="checkbox" ${state.filters.category === 'vintage' ? 'checked' : ''} onchange="applyCategoryFilter('vintage')"> Vintage</label>
                  <label><input type="checkbox" ${state.filters.category === 'thrift' ? 'checked' : ''} onchange="applyCategoryFilter('thrift')"> Thrift</label>
                  <label><input type="checkbox" ${state.filters.category === 'surplus' ? 'checked' : ''} onchange="applyCategoryFilter('surplus')"> Surplus</label>
                </div>
              </div>
            </aside>

            <div>
              <div style="margin-bottom: var(--space-md); font-size: 0.9rem; color: var(--muted);">
                Showing ${filtered.length} results
              </div>
              ${filtered.length > 0 ? `
                <div class="product-grid">
                  ${filtered.map(p => renderProductCard(p)).join('')}
                </div>
              ` : `
                <div style="text-align: center; padding: var(--space-xl); color: var(--muted);">
                  <p>No products found matching your criteria.</p>
                  <button class="btn btn-outline btn-sm" style="margin-top: 16px;" onclick="resetFilters()">Clear Filters</button>
                </div>
              `}
            </div>
          </div>
        </div>
        ${renderStoreInfo()}
      `;
    }

    function renderProductCard(product) {
      const isWished = state.wishlist.includes(product.id);
      
      return `
        <div class="product-card" onclick="navigate('product', {id: '${product.id}'})">
          <div class="product-image-wrapper">

    let selectedSize = null;

      addToCart(product, selectedSize);
      selectedSize = null;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));

    function applyCategoryFilter(cat) {
      state.filters.category = cat;
      renderView();
    }

    function applySort(sort) {
      state.filters.sort = sort;
      renderView();
    }

    function resetFilters() {
      state.filters = { category: 'all', sort: 'featured' };
      renderView();
    }

    /* =========================================================================
       ANIMATIONS & INIT
       ========================================================================= */

    function initScrollAnimations() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.product-card, .section-header').forEach(el => {
        el.classList.add('fade-in');
        observer.observe(el);
      });
    }

    function toggleMobileMenu() {
      showToast('Mobile menu clicked');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeCart(); closeModal(); }
    });

       ========================================================================= */

      loadState();
      renderView();
      updateCartUI();
